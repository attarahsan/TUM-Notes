<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUM Notes Hub — Buy & Sell Study Notes</title>
<meta name="description" content="The student marketplace for study notes at Times University Multan. Buy and sell quality notes, organized by department and subject.">
<meta name="keywords" content="TUM Notes Hub, Times University Multan notes, study notes Pakistan, buy notes, sell notes, past papers, handwritten notes">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://tumpronote.netlify.app/">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4f46e5">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TUM Notes">
<meta property="og:type" content="website">
<meta property="og:title" content="TUM Notes Hub — Buy & Sell Study Notes">
<meta property="og:description" content="Times University Multan ka apna notes marketplace. Buy & sell PDF notes and handwritten photo galleries.">
<meta property="og:url" content="https://tumpronote.netlify.app/">
<style>
:root{
  --bg:#f4f5fa; --card:#ffffff; --ink:#141726; --muted:#69708a;
  --brand:#4f46e5; --brand-d:#3f37c9; --brand-soft:#eef0ff;
  --green:#16a34a; --green-soft:#e8f7ee; --red:#dc2626; --red-soft:#fdecec;
  --amber:#b45309; --amber-soft:#fef4e2; --line:#e6e8f0;
  --shadow:0 2px 10px rgba(20,23,38,.06); --shadow-lg:0 14px 34px rgba(79,70,229,.14);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
header.site{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60}
.nav{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:13px 20px}
.logo{font-weight:900;font-size:21px;color:var(--brand);cursor:pointer;letter-spacing:-.4px;white-space:nowrap}
.logo small{display:block;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:2.5px}
.nav-links{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap}
.nav-links button{background:none;border:none;padding:9px 15px;border-radius:10px;font-size:14.5px;cursor:pointer;color:var(--ink);font-weight:600;font-family:inherit}
.nav-links button:hover{background:var(--brand-soft)}
.nav-links button.active{background:var(--brand);color:#fff}
.langtoggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:6px}
.langtoggle button{padding:7px 10px!important;font-size:12.5px!important;border-radius:0!important;color:var(--muted)}
.langtoggle button.on{background:var(--brand);color:#fff}
.live-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green)}
.live-dot i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
main{max-width:1140px;margin:0 auto;padding:24px 20px 70px}
.hero{background:linear-gradient(120deg,#312e81 0%,#4f46e5 55%,#7c3aed 100%);color:#fff;border-radius:22px;padding:52px 40px;margin-bottom:30px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero h1{font-size:34px;letter-spacing:-.6px;margin-bottom:10px;position:relative;z-index:1}
.hero p{opacity:.92;margin-bottom:22px;font-size:16px;position:relative;z-index:1}
.searchbar{display:flex;gap:8px;max-width:560px;position:relative;z-index:1}
.searchbar input{flex:1;padding:14px 18px;border:none;border-radius:12px;font-size:15px;outline:none;box-shadow:var(--shadow-lg)}
.searchbar button{background:#141726;color:#fff;border:none;border-radius:12px;padding:0 26px;font-size:15px;font-weight:700;cursor:pointer}
.stats{display:flex;gap:26px;margin-top:24px;position:relative;z-index:1}
.stats div b{font-size:22px;display:block}
.stats div span{font-size:12.5px;opacity:.85}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin:8px 0 20px}
.chip{background:var(--card);border:1px solid var(--line);padding:9px 17px;border-radius:999px;font-size:14px;cursor:pointer;font-weight:600;box-shadow:var(--shadow);transition:.15s}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 16px}
.section-title{font-size:22px;font-weight:800;letter-spacing:-.4px}
.section-link{font-size:14px;color:var(--brand);font-weight:700;cursor:pointer;background:none;border:none;font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;transition:transform .14s,box-shadow .14s;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16.5px;margin-bottom:7px;line-height:1.4;letter-spacing:-.2px}
.card .meta{font-size:13px;color:var(--muted);margin-bottom:12px}
.card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--line)}
.price{font-weight:800;font-size:17px;color:var(--brand)}
.price.free{color:var(--green)}
.stars{color:#f59e0b;font-size:14px;letter-spacing:2px}
.rcount{font-size:12px;color:var(--muted)}
.sellerline{font-size:12.5px;color:var(--muted);margin-top:8px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 11px;border-radius:999px;background:var(--brand-soft);color:var(--brand);margin-left:7px;vertical-align:middle}
.badge.pending{background:var(--amber-soft);color:var(--amber)}
.badge.rejected{background:var(--red-soft);color:var(--red)}
.filters{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:20px;box-shadow:var(--shadow);position:sticky;top:67px;z-index:40}
.filters .frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.filters .frow:last-child{margin-bottom:0}
.filters select,.filters input[type=text]{padding:10px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;font-family:inherit}
.filters label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.detail{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:var(--shadow)}
.detail h1{font-size:27px;margin-bottom:9px;letter-spacing:-.5px}
.detail .meta{color:var(--muted);font-size:14px;margin-bottom:18px}
.detail .topline{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.detail .desc{background:var(--bg);border-radius:13px;padding:18px;font-size:15px;line-height:1.65;margin:18px 0;white-space:pre-wrap}
.btn{background:var(--brand);color:#fff;border:none;border-radius:11px;padding:13px 26px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:var(--red)}
.btn.small{padding:8px 15px;font-size:13px;border-radius:9px}
.back{background:none;border:none;color:var(--brand);font-weight:700;font-size:14px;cursor:pointer;margin-bottom:16px;font-family:inherit}
.review{border-top:1px solid var(--line);padding:15px 0}
.review .who{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.review .txt{font-size:14.5px;margin-top:7px;line-height:1.55;color:#333a4d}
form.fcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;max-width:660px;box-shadow:var(--shadow)}
form.fcard h2{margin-bottom:8px;letter-spacing:-.4px}
form.fcard .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:7px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.field textarea{min-height:96px;resize:vertical}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.notice{background:var(--brand-soft);border:1px solid #c9d2fd;color:#3730a3;border-radius:11px;padding:13px 16px;font-size:14px;margin-bottom:16px;line-height:1.5}
.notice.warn{background:var(--amber-soft);border-color:#f3d38b;color:#92400e}
.notice.ok{background:var(--green-soft);border-color:#a9dfc0;color:#166534}
.tabs{display:flex;gap:7px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{background:var(--card);border:1px solid var(--line);padding:11px 20px;border-radius:11px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;box-shadow:var(--shadow)}
.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
table.admin{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-size:14px;box-shadow:var(--shadow)}
table.admin th,table.admin td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.admin th{background:#f3f4f8;font-size:11.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}
table.admin td .acts{white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:15px}
.loading{text-align:center;color:var(--muted);padding:56px;font-size:15px}
.err{background:var(--red-soft);color:#991b1b;border-radius:11px;padding:13px 16px;margin-bottom:15px;font-size:14px}
#toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:#141726;color:#fff;padding:14px 19px;border-radius:13px;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:slidein .25s ease;max-width:330px}
@keyframes slidein{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.skel{background:linear-gradient(90deg,#eceef4 25%,#f7f8fc 50%,#eceef4 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:var(--radius);height:190px}
@keyframes sk{to{background-position:-200% 0}}
.statcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.statcard .lbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.statcard .val{font-size:30px;font-weight:800;letter-spacing:-.5px}
footer.site{border-top:1px solid var(--line);background:var(--card);margin-top:20px}
footer.site .in{max-width:1140px;margin:0 auto;padding:30px 20px;display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;align-items:center;color:var(--muted);font-size:13.5px}
/* ---------- responsive: mobile fits mobile, desktop fits desktop ---------- */
html,body{overflow-x:hidden;overflow-x:clip}
img{max-width:100%;height:auto}
@media(max-width:760px){
  main{padding:16px 12px 60px}
  .nav{padding:10px 12px;gap:8px}
  .logo{font-size:18px;flex:0 0 auto}
  .logo small{font-size:9px;letter-spacing:2px}
  .nav-links{width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;gap:2px;padding:2px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links button{padding:8px 12px;font-size:13.5px;white-space:nowrap;flex:0 0 auto}
  .live-dot,#userBox{flex:0 0 auto}
  .hero{padding:30px 20px;margin-bottom:20px;border-radius:18px}
  .hero h1{font-size:23px}
  .hero p{font-size:14px;margin-bottom:16px}
  .searchbar{flex-direction:column}
  .searchbar button{padding:13px 20px}
  .stats{flex-wrap:wrap;gap:12px 20px;margin-top:18px}
  .stats div b{font-size:19px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .card{padding:13px}
  .card h3{font-size:14px}
  .card .meta{font-size:12px}
  .price{font-size:15px}
  .filters{top:100px;padding:13px;margin-bottom:14px}
  .detail{padding:20px 16px;border-radius:16px}
  .detail h1{font-size:20px}
  .detail .desc{padding:14px;font-size:14px}
  form.fcard{padding:22px 16px;border-radius:16px}
  .frow2{grid-template-columns:1fr}
  .section-title{font-size:19px}
  .section-head{margin:22px 0 12px}
  table.admin{font-size:12.5px}
  table.admin th,table.admin td{padding:10px 8px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{padding:9px 14px;font-size:13px;white-space:nowrap;flex:0 0 auto}
  .sp-brand{white-space:normal;letter-spacing:3px;line-height:1.3}
  .sp-brand2{white-space:normal;letter-spacing:2px;line-height:1.3}
  .sp-inner{padding:14px}
  .sp-feats{max-width:100%}
  #toasts{left:12px;right:12px;bottom:12px}
  .toast{max-width:none}
  .statcard{padding:16px}
  .statcard .val{font-size:23px}
  .btn{padding:12px 20px}
  footer.site .in{padding:22px 14px;font-size:12.5px}
}
@media(max-width:380px){
  .grid{grid-template-columns:1fr}
  .hero h1{font-size:20px}
}
/* ---- splash intro ---- */
#splash{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:radial-gradient(1100px 550px at 50% 18%,#3730a3 0%,#191736 55%,#0e0d1f 100%);transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
.sp-inner{text-align:center;padding:20px;max-width:660px;width:100%}
.sp-stage{animation:stagein .55s ease both}
@keyframes stagein{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.sp-kicker{color:#a5b4fc;font-size:12px;font-weight:800;letter-spacing:6px;margin-bottom:18px}
.sp-brand{font-size:clamp(30px,6.4vw,62px);font-weight:900;letter-spacing:7px;white-space:nowrap;
  background:linear-gradient(90deg,#c7d2fe,#f0abfc,#fde68a,#c7d2fe);background-size:250% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 3.2s linear infinite}
.sp-brand span{display:inline-block;animation:flutter 2.4s ease-in-out infinite}
@keyframes flow{to{background-position:250% center}}
@keyframes flutter{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-11px) rotate(2.5deg)}}
.sp-brand2{font-size:clamp(34px,7vw,68px);font-weight:900;letter-spacing:4px;white-space:nowrap;
  background:linear-gradient(90deg,#fde68a,#f0abfc,#c7d2fe,#fde68a);background-size:250% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 3.2s linear infinite}
.sp-by{color:#e0e7ff;margin-top:16px;font-size:clamp(15px,2.6vw,21px)}
.sp-by b{color:#fde68a}
.sp-tag{color:#8b93b8;margin-top:10px;font-size:12.5px;letter-spacing:3px}
.sp-feats{display:flex;flex-direction:column;gap:14px;margin:26px auto 0;max-width:430px;text-align:left}
.sp-feat{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px 16px}
.sp-feat .ic{font-size:24px;flex:0 0 auto}
.sp-feat .tx{color:#e0e7ff;font-size:14.5px;line-height:1.5}
.sp-feat .tx b{color:#fde68a}
.sp-dots{display:flex;gap:8px;justify-content:center;margin-top:30px}
.sp-dots i{width:8px;height:8px;border-radius:50%;background:#3b4270;transition:all .3s}
.sp-dots i.on{background:#fde68a;transform:scale(1.35)}
.sp-skip{color:#5b6390;margin-top:22px;font-size:12px}
/* ===== content protection ===== */
.nocopy,.nocopy *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
.wm-wrap{position:relative}
.wm-overlay{position:absolute;inset:0;pointer-events:none;z-index:6;background-repeat:repeat}
/* anonymous chat */
.chatbox{border:1px solid var(--line);border-radius:14px;background:var(--card);height:52vh;min-height:300px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.chatmsg{max-width:85%;background:#f1f3f9;border-radius:12px;padding:8px 12px;align-self:flex-start}
.chatmsg.mine{background:#e8f0fe;align-self:flex-end}
.chatmsg .who{font-size:11.5px;font-weight:800;color:var(--brand);margin-bottom:2px}
.chatmsg .txt{font-size:14.5px;word-wrap:break-word;white-space:pre-wrap}
.chatmsg .ts{font-size:10.5px;color:var(--muted);margin-top:3px;text-align:right}
.chatform{display:flex;gap:8px;margin-top:10px}
.chatform input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px}
.chatmsg .del{background:none;border:none;color:#dc2626;font-size:11px;cursor:pointer;padding:0;margin-top:2px}
#veil{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;background:rgba(8,8,20,.97)}
#veil.show{display:flex}
@media print{
  .detail,#noteGallery,.wm-wrap{display:none!important}
  body::after{content:"Printing is disabled on TUM Notes Hub";display:block;text-align:center;padding:60px;font-size:18px}
}
/* fullscreen page viewer (purchased notes) */
#pageViewer{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;background:rgba(5,5,15,.96)}
#pageViewer.open{display:flex}
#pageViewer .pv-back{position:absolute;inset:0}
#pageViewer .pv-wrap{position:relative;max-width:94vw;max-height:92vh}
#pageViewer .pv-wrap img{max-width:94vw;max-height:92vh;border-radius:12px;display:block}
#pageViewer .pv-btn{position:absolute;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:50%;width:46px;height:46px;font-size:24px;cursor:pointer;z-index:2}
#pageViewer .pv-close{top:14px;right:14px}
#pageViewer .pv-prev{left:12px;top:50%;transform:translateY(-50%)}
#pageViewer .pv-next{right:12px;top:50%;transform:translateY(-50%)}
#pageViewer .pv-count{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.5);padding:6px 14px;border-radius:20px;font-size:13px;z-index:2}
</style>
</head>
<body>

    <div id="spStage"></div>
    <div class="sp-dots" id="spDots"></div>
    <div class="sp-skip">tap anywhere to skip</div>
  </div>
</div>
<header class="site">
  <div class="nav">
    <div class="logo" onclick="go('home')">TUM Notes Hub<small>TIMES UNIVERSITY MULTAN</small></div>
    <div class="nav-links">
      <span class="live-dot" id="liveDot" title="Realtime connection"><i></i>Live</span>
      <button data-nav="home" onclick="go('home')">Home</button>
      <button data-nav="browse" onclick="go('browse')">Browse</button>
      <button data-nav="sell" onclick="go('sell')">Sell</button>
      <button data-nav="chat" onclick="go('chat')">💬 Chat</button>
      <button data-nav="plans" onclick="go('plans')">💎 Plans</button>
      <button data-nav="wishlist" id="wishBtn" onclick="go('wishlist')" style="display:none">♥ Wishlist</button>
      <button data-nav="dashboard" id="dashBtn" onclick="go('dashboard')" style="display:none">📊 Dashboard</button>
      <button data-nav="notifications" id="notifBtn" onclick="go('notifications')" style="display:none;position:relative">🔔<span id="notifBadge" style="display:none;position:absolute;top:2px;right:2px;background:#dc2626;color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;line-height:18px;text-align:center;padding:0 4px"></span></button>
      <button data-nav="wallet" id="walletBtn" onclick="go('wallet')" style="display:none">Wallet</button>
      <button data-nav="admin" id="adminBtn" onclick="go('admin')" style="display:none">Admin</button>
      <span class="langtoggle" title="Language / زبان"><button id="langUr" onclick="setLang('ur')">UR</button><button id="langEn" onclick="setLang('en')">EN</button></span>
      <span id="userBox" style="display:flex;gap:8px;align-items:center"></span>
    </div>
  </div>
</header>
<main id="app"><div class="loading">Loading…</div></main>
<div id="toasts"></div>
<footer class="site"><div class="in">
  <div><b style="color:var(--ink)">TUM Notes Hub</b> — the student marketplace for study notes.</div>

      '<button class="pv-btn pv-close" onclick="closePageViewer()">✕</button>' +

      '<button class="pv-btn pv-next" onclick="pvNav(1,event)">›</button>' +

      if(!document.getElementById("pageViewer") || !document.getElementById("pageViewer").classList.contains("open")) return;

  document.getElementById("pvCount").textContent = (pvIdx + 1) + " / " + pvImgs.length;
  ov.classList.add("open");

async function googleLogin(){
  const msg = document.getElementById("a_msg");
  if(msg) msg.innerHTML = "Opening Google…";
  try{
    const {error} = await db.auth.signInWithOAuth({provider: "google", options: {redirectTo: location.origin + location.pathname}});
    if(error) throw error;
  }catch(e){ if(msg) msg.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
}
let _gsync = false;
function showAuthBanner(msg){
  let b = document.getElementById("authBanner");
  if(!b){
    b = document.createElement("div");
    b.id = "authBanner";
    b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:1000;background:#7f1d1d;color:#fff;padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.3)";
    b.innerHTML = '<span id="authBannerMsg" style="flex:1;text-align:center;line-height:1.5"></span><button onclick="this.parentNode.remove()" style="background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:14px">✕</button>';
    document.body.prepend(b);
  }
  const m = document.getElementById("authBannerMsg");
  if(m) m.textContent = msg;
  b.style.display = "flex";
}
function cleanAuthParams(){
  try{
    const u = new URL(location.href);
    u.searchParams.delete("code"); u.searchParams.delete("error"); u.searchParams.delete("error_description"); u.searchParams.delete("error_code");
    history.replaceState(null, "", u.pathname + (u.searchParams.toString() ? "?" + u.searchParams.toString() : "") + u.hash);
  }catch(e){}
}
async function sha256hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2, "0"); }).join("");
}
function promptAdminPassword(urow){
  return new Promise(function(resolve){
    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;z-index:2000;background:rgba(10,10,25,.72);display:flex;align-items:center;justify-content:center;padding:20px";
    ov.innerHTML = '<div class="fcard" style="max-width:380px;width:100%;margin:0"><h2>🔐 Admin verification</h2><div class="sub">"+T("Ye <b>admin account</b> hye. Login mukammal karne ke liye admin password dalein.")+"</div><div id="ap_msg"></div><div class="field"><label>Admin password</label><input id="ap_pass" type="password" placeholder="••••••••" autocomplete="current-password"></div><button class="btn" id="ap_ok" style="width:100%">Verify & login</button><button class="btn ghost" id="ap_cancel" style="width:100%;margin-top:8px">Cancel</button></div>';
    document.body.appendChild(ov);
    const done = function(ok){ try{ ov.remove(); }catch(e){} resolve(ok); };
    document.getElementById("ap_cancel").onclick = function(){ done(false); };
    const okBtn = document.getElementById("ap_ok");
    okBtn.onclick = async function(){
      const v = document.getElementById("ap_pass").value;
      const m = document.getElementById("ap_msg");
      if(!v){ m.innerHTML = '<div class="err">Password dalein</div>'; return; }
      okBtn.disabled = true; okBtn.textContent = "Checking…";
      try{
        const good = await verifyAdminPassword(v, urow);
        if(good){ done(true); }
        else{ m.innerHTML = '<div class="err">"+T("❌ Ghalat password — dobara try karein")+"</div>'; okBtn.disabled = false; okBtn.textContent = "Verify & login"; }
      }catch(e){ m.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; okBtn.disabled = false; okBtn.textContent = "Verify & login"; }
    };
    document.getElementById("ap_pass").onkeydown = function(e){ if(e.key === "Enter") okBtn.click(); };
    setTimeout(function(){ const i = document.getElementById("ap_pass"); if(i) i.focus(); }, 120);
  });
}
async function verifyAdminPassword(plain, urow){
  const {data, error} = await db.from("users").select("admin_pass_hash").eq("uid", urow.uid).limit(1);
  if(error) throw error;
  const h = data && data[0] && data[0].admin_pass_hash;
  if(!h) throw new Error(T("Admin password abhi set nahi hua"));
  return (await sha256hex("tum-admin::" + plain)) === h;
}
async function handleGoogleSession(){
  if(_gsync) return;
  _gsync = true;
  try{
    const q = new URLSearchParams(location.search);
    const cbErr = q.get("error");
    if(cbErr){
      const msg = "Google login failed: " + ((q.get("error_description") || cbErr).replace(/\+/g, " "));
      cleanAuthParams();
      toast(msg); showAuthBanner(msg); console.error(msg);
      return;
    }
    const code = q.get("code");
    let codeErr = null;
    if(code){
      // Explicit PKCE code exchange — do not rely only on auto-detect
      try{
        const res = await db.auth.exchangeCodeForSession(code);
        if(res && res.error) codeErr = res.error;
      }catch(e){ codeErr = e; }
      cleanAuthParams();
    }
    const {data: sess, error: sessErr} = await db.auth.getSession();
    if(sessErr) throw sessErr;
    const session = sess && sess.session;
    if(!session || !session.user){
      if(code){
        const msg = T("Login failed: Google se wapas to aaye lekin session nahi ban saka") + (codeErr ? " (" + (codeErr.message || codeErr) + ")" : "") + T(". Dobara try karein.");
        toast(msg); showAuthBanner(msg); console.error(msg, codeErr);
      }
      return;
    }
    const au = session.user;
    const email = (au.email || "").toLowerCase();
    if(!email) throw new Error("Google account has no email address");
    const meta = au.user_metadata || {};
    const name = meta.full_name || meta.name || email.split("@")[0];
    const {data: rows, error: selErr} = await db.from("users").select("*").eq("email", email).limit(1);
    if(selErr) throw selErr;
    let urow;
    let isNewUser = false;
    if(rows && rows.length){
      urow = rows[0];
    }else{
      isNewUser = true;
      const {data: ins, error} = await db.from("users").insert({uid: au.id, name: name, email: email, role: "user", is_admin: false, wallet: 20, total_earnings: 0, plan: "free", note_limit: 25, plan_expires: 0, created_at: Date.now(), referred_by: (localStorage.getItem("tum_ref") || null)}).select();
      if(error) throw error;
      urow = ins[0];
      setTimeout(function(){ toast("🎉 Account created — Rs 20 welcome bonus added!"); }, 900);
    }
    if(urow.is_admin){
      const alreadyAdmin = currentUser() && currentUser().is_admin && currentUser().email === email;
      if(code || !alreadyAdmin){
        const ok = await promptAdminPassword(urow);
        if(!ok){
          try{ await db.auth.signOut(); }catch(e){}
          localStorage.removeItem("tum_user");
          updateUserBox();
          toast(T("❌ Ghalat password — admin login nahi hua"));
          return;
        }
      }
    }
    setSession({uid: urow.uid, name: urow.name, email: urow.email, is_admin: urow.is_admin});
    if(code) logActivity(isNewUser ? "signup" : "signin");
    await refreshWallet();
    if(code) toast("✅ Logged in as " + (urow.name || email));
  }catch(e){
    const msg = "Login failed: " + (e.message || e);
    console.error(msg, e);
    toast(msg);
    showAuthBanner(msg);
  }finally{
    _gsync = false;
  }
}

VIEWS.browse = async function(){
  app.innerHTML = '<div class="grid">' + '<div class="skel"></div>'.repeat(4) + '</div>';
  try{
    const notes = await approvedNotes(300);
    DEPARTMENTS = [...new Set(notes.map(function(n){ return n.department; }).filter(Boolean))].sort();
    renderBrowse(notes);
  }catch(e){ app.innerHTML = '<div class="err">Could not load notes: '+esc(e.message)+'</div>'; }
};
function renderBrowse(notes){
  const f = filters;
  let list = notes.filter(function(n){
    if(f.q){ const q = f.q.toLowerCase(); if(!((n.title||"").toLowerCase().includes(q) || (n.subject||"").toLowerCase().includes(q) || (n.seller_name||"").toLowerCase().includes(q))) return false; }
    if(f.dept && n.department !== f.dept) return false;
    if(f.free === "free" && Number(n.price) !== 0) return false;
    if(f.free === "paid" && Number(n.price) === 0) return false;
    if(f.subject && !(n.subject||"").toLowerCase().includes(f.subject.toLowerCase())) return false;
    if(f.sem && String(n.semester) !== String(f.sem)) return false;
    if(f.band !== "any"){ const lim = {b50:50,b100:100,b200:200,b300:300}[f.band]; if((Number(n.price)||0) > lim) return false; }
    return true;
  });
  const sorts = { new:function(a,b){ return (+b.created_at||0)-(+a.created_at||0); },
    plow:function(a,b){ return (+a.price||0)-(+b.price||0); },
    phigh:function(a,b){ return (+b.price||0)-(+a.price||0); },
    top:function(a,b){ return (+b.rating||0)-(+a.rating||0); } };
  list.sort(sorts[f.sort] || sorts.new);
  const selVal = {ffree:"free", fdept:"dept", fsem:"sem", fband:"band", fsort:"sort"};
  app.innerHTML =
    '<div class="section-title" style="margin-top:4px">Browse notes</div>' +
    '<div class="filters">' +
      '<div class="frow"><label>Search</label><input type="text" id="fq" placeholder="Title, subject, seller…" value="'+esc(f.q)+'" style="flex:1;min-width:180px">' +
      '<label>Type</label><select id="ffree"><option value="all">All</option><option value="free">Free</option><option value="paid">Paid</option></select>' +
      '<label>Department</label><select id="fdept"><option value="">All</option>' + DEPARTMENTS.map(function(d){ return '<option>'+esc(d)+'</option>'; }).join("") + '</select></div>' +
      '<div class="frow"><label>Subject</label><input type="text" id="fsub" placeholder="e.g. Calculus" value="'+esc(f.subject)+'">' +
      '<label>Semester</label><select id="fsem"><option value="">All</option>'+[1,2,3,4,5,6,7,8].map(function(s){ return '<option>'+s+'</option>'; }).join("")+'</select>' +
      '<label>Max price</label><select id="fband"><option value="any">Any</option><option value="b50">≤ Rs 50</option><option value="b100">≤ Rs 100</option><option value="b200">≤ Rs 200</option><option value="b300">≤ Rs 300</option></select>' +
      '<label>Sort</label><select id="fsort"><option value="new">Newest first</option><option value="plow">Price: low → high</option><option value="phigh">Price: high → low</option><option value="top">Top rated</option></select>' +
      '<button class="btn small ghost" onclick="applyFilters()">Apply</button></div>' +
    '</div>' +
    '<div style="color:var(--muted);font-size:14px;margin-bottom:14px">'+list.length+' note(s) found · updates live</div>' +
    '<div class="grid">' + list.map(noteCard).join("") + '</div>' +
    (list.length === 0 ? '<div class="empty">No notes match your filters.</div>' : '');
  Object.keys(selVal).forEach(function(id){ document.getElementById(id).value = f[selVal[id]]; });
  document.getElementById("fq").addEventListener("keydown", function(e){ if(e.key === "Enter") applyFilters(); });
}
function applyFilters(){
  filters.q = document.getElementById("fq").value.trim();
  filters.free = document.getElementById("ffree").value;
  filters.dept = document.getElementById("fdept").value;
  filters.subject = document.getElementById("fsub").value.trim();
  filters.sem = document.getElementById("fsem").value;
  filters.band = document.getElementById("fband").value;
  filters.sort = document.getElementById("fsort").value;
  saveFilters(); VIEWS.browse();
}

async function submitReview(note_id){

let chatSub = null, lastChatSent = 0, myChatToken = null;
const CHAT_ANIMALS = ["🦊","🐼","🐨","🐯","🦁","🐸","🐵","🐷","🐰","🐻","🐶","🐱","🦄","🐝","🦋","🐢","🐙","🦜","🐳","🦉"];
function anonTag(sender_id){
  let h = 0; const s = String(sender_id || "");
  for(let i = 0; i < s.length; i++) h = ((h * 31) + s.charCodeAt(i)) >>> 0;
  return "Anonymous " + CHAT_ANIMALS[h % CHAT_ANIMALS.length];
}
function chatMsgHtml(m, me, showDel){
  const mine = myChatToken && m.sender_id === myChatToken;
  return '<div class="chatmsg' + (mine ? " mine" : "") + '" data-mid="' + m.id + '"><div class="who">' + esc(anonTag(m.sender_id)) + (mine ? " (aap)" : "") + '</div>' +
    '<div class="txt">' + esc(m.text) + '</div><div class="ts">' + fmtDateTime(m.created_at) +
    (showDel ? ' · <button class="del" onclick="adminChatDel(' + m.id + ')">🗑 delete</button>' : "") + '</div></div>';
}
VIEWS.chat = async function(){
  const u = requireLogin(); if(!u) return;
  if(chatSub){ try{ chatSub.unsubscribe(); }catch(e){} chatSub = null; }

  app.innerHTML = '<div class="section-title" style="margin-top:4px">💬 Anonymous chat</div>' +
    '<div class="sub" style="margin-bottom:12px">"+T("🕵️ Yahan <b>sab anonymous</b> hain — kisi ko nahi pata chalega kon likh raha hye. Notes request karein, e.g. <i>\"Mujhe Physics Ch.4 ke neat notes chahiye\"</i> — jis ke paas honge wo note ka title bata dega.")+"</div>' +
    '<div id="chatBox" class="chatbox"><div class="loading">Loading messages…</div></div>' +
    '<form class="chatform" onsubmit="sendChatMsg(event)"><input id="chatInp" maxlength="500" placeholder="'+T("Apna message likhein…")+'" autocomplete="off"><button class="btn" type="submit">Send</button></form>' +
    '<div class="sub" style="margin-top:8px">"+T("⚠️ Galat zaban ya spam par admin message delete kar sakta hye.")+"</div>';
  const box = document.getElementById("chatBox");
  try{
    const {data, error} = await db.from("chat_messages").select("id,sender_id,text,created_at").order("created_at",{ascending:false}).limit(60);
    if(error) throw error;
    const msgs = (data || []).reverse();
    box.innerHTML = msgs.length ? msgs.map(function(m){ return chatMsgHtml(m, u, false); }).join("") : '<div class="empty">"+T("Abhi koi message nahi — pehla message aap bhejein! 👋")+"</div>';
    box.scrollTop = box.scrollHeight;
  }catch(e){ box.innerHTML = '<div class="err">'+T("Chat load nahi ho saka: ")+esc(e.message)+'</div>'; return; }
  chatSub = db.channel("chat-room")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"chat_messages"}, function(p){
      if(currentView !== "chat") return;
      const b = document.getElementById("chatBox"); if(!b) return;
      const em = b.querySelector(".empty"); if(em) em.remove();
      if(b.querySelector('[data-mid="' + p.new.id + '"]')) return;
      b.insertAdjacentHTML("beforeend", chatMsgHtml(p.new, currentUser(), false));
      b.scrollTop = b.scrollHeight;
    }).subscribe();
};
async function sendChatMsg(ev){
  ev.preventDefault();
  const u = currentUser(); if(!u) return;
  const inp = document.getElementById("chatInp");
  const t = (inp.value || "").trim();
  if(!t) return;
  if(t.length > 500){ toast(T("Message 500 characters se zyada nahi ho sakta")); return; }
  const now = Date.now();
  if(now - lastChatSent < 3000){ toast(T("Thoda rukein — 3 second me 1 message ⏳")); return; }
  lastChatSent = now; inp.value = "";
  const {error} = await db.rpc("send_chat_message", {p_text: t});
  if(error){ toast("Failed: " + (/slow down/i.test(error.message) ? T("Thoda rukein — 3 second me 1 message ⏳") : error.message)); lastChatSent = 0; }
}

async function uploadToStorage(file, folder){
  const ext = (file.name.split(".").pop() || "bin").toLowerCase();
  const path = folder + "/" + Date.now() + "_" + Math.random().toString(36).slice(2,8) + "." + ext;
  const {error} = await db.storage.from("notes").upload(path, file);
  if(error) throw error;
  return db.storage.from("notes").getPublicUrl(path).data.publicUrl;
}
/* compress big phone photos on-device before upload: max 1600px, JPEG 85%.
   This is what makes gallery uploads fast — a 4MB photo becomes ~300KB. */
async function compressImage(file){
  try{
    if(!file || !file.type || file.type.indexOf("image/") !== 0) return file;
    if(file.size < 400*1024) return file; // already small — upload as-is
    const bmp = await createImageBitmap(file);
    const MAXD = 1600;
    let w = bmp.width, h = bmp.height;
    const m = Math.max(w, h);
    if(m > MAXD){ const s = MAXD / m; w = Math.round(w*s); h = Math.round(h*s); }
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(bmp, 0, 0, w, h);
    if(bmp.close) bmp.close();
    const blob = await new Promise(function(res){ cv.toBlob(res, "image/jpeg", 0.85); });
    if(!blob || blob.size >= file.size) return file;
    const nm = (file.name || "photo").replace(/\.[^.]+$/, "") + ".jpg";
    return new File([blob], nm, {type: "image/jpeg"});
  }catch(e){ return file; }
}

async function submitImgNote(ev){
  ev.preventDefault();
  const u = currentUser(); if(!u) return;
  const msg = document.getElementById("sell_msg");
  const files = Array.prototype.slice.call(document.getElementById("s_imgs").files);
  if(files.length < 1){ msg.innerHTML = '<div class="notice warn">Please attach at least 1 photo.</div>'; return; }
  if(files.length > 50){ msg.innerHTML = '<div class="notice warn">Maximum 50 photos per note.</div>'; return; }
  const {count} = await db.from("notes").select("note_id", {count:"exact", head:true}).eq("seller_id", u.uid);
  const {data: urow} = await db.from("users").select("note_limit").eq("uid", u.uid).limit(1);
  const limit = (urow && urow[0] && urow[0].note_limit) || 25;
  if(limitReached(count || 0, limit)){ msg.innerHTML = '<div class="err">Plan limit reached (' + planLimitTxt(limit) + ' notes). <a href="#" onclick="go(\'plans\');return false;" style="color:var(--brand);font-weight:700">Upgrade your plan 💎</a></div>'; return; }
  const price = Math.max(0, parseInt(document.getElementById("s_price").value, 10) || 0);
  try{
    // fast uploads: compress on-device + 4 parallel uploads with live progress
    const urls = new Array(files.length);
    let done = 0;
    msg.innerHTML = T("⚡ Photos compress + upload ho rahi hain (0/") + files.length + ")…";
    let idx = 0;
    async function upWorker(){
      while(idx < files.length){
        const i = idx++;
        urls[i] = await uploadToStorage(await compressImage(files[i]), "noteimgs");
        done++;
        msg.innerHTML = "⚡ Uploading photo " + done + "/" + files.length + "…";
      }
    }
    const workers = [];
    for(let w = 0; w < Math.min(4, files.length); w++) workers.push(upWorker());
    await Promise.all(workers);
    msg.innerHTML = "Saving…";
    const {error} = await db.from("notes").insert({
      note_id: Math.floor(Date.now() / 1000),
      seller_id: u.uid, seller_name: u.name,
      title: document.getElementById("s_title").value.trim(),

      department: document.getElementById("s_dept").value.trim() || "Computing/AI",

      price: price, note_type: "images",
      ai_summary: document.getElementById("s_desc").value.trim(),
      file_url: "", image_urls: JSON.stringify(urls),
      status: "pending", created_at: Date.now()
    });
    if(error) throw error;
    msg.innerHTML = '<div class="notice ok">Submitted! ' + files.length + ' photos · <b>Rs ' + price + '</b>. The admin will verify then publish.</div>';
    ev.target.reset(); updImgPrice();
  }catch(e){ msg.innerHTML = '<div class="err">Failed: ' + esc(e.message) + '</div>'; }

async function setWithdrawPassword(ev){
  ev.preventDefault();
  const me = currentUser(); if(!me) return;
  const v = document.getElementById("wp_new").value;
  const m = document.getElementById("wp_msg");
  if(!v || v.length < 6){ m.innerHTML = '<div class="err">"+T("Password kam az kam 6 characters ka ho")+"</div>'; return; }
  try{
    const h = await sha256hex("tum-withdraw::" + v);
    const {error} = await db.from("users").update({withdraw_pass_hash: h}).eq("uid", me.uid);
    if(error) throw error;
    me.withdraw_pass_hash = h;
    localStorage.setItem("tum_user", JSON.stringify(me));
    toast(T("✅ Withdrawal password set ho gaya"));
    VIEWS.wallet();
  }catch(e){ m.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
}
async function submitWithdraw(ev){
  ev.preventDefault();
  const me = currentUser(); if(!me) return;
  const msg = document.getElementById("w_msg");
  const amount = Math.floor(Number(document.getElementById("w_amount").value));
  const method = document.getElementById("w_method").value;
  const acctTitle = document.getElementById("w_title").value.trim();
  const acct = document.getElementById("w_acct").value.trim();
  const pw = document.getElementById("w_pass").value;
  if(!amount || amount < MIN_WITHDRAWAL){ msg.innerHTML = '<div class="notice warn">Minimum withdrawal is Rs '+MIN_WITHDRAWAL+'.</div>'; return; }
  if(WITHDRAW_METHODS.indexOf(method) < 0){ msg.innerHTML = '<div class="notice warn">Please choose a withdraw method.</div>'; return; }
  if(!acctTitle){ msg.innerHTML = '<div class="notice warn">Please enter the account title (naam).</div>'; return; }
  if(acct.length < 10){ msg.innerHTML = '<div class="notice warn">"+T("Account / mobile number ghalat hye.")+"</div>'; return; }
  if(!pw){ msg.innerHTML = '<div class="notice warn">Withdrawal password dalein.</div>'; return; }
  msg.innerHTML = "Processing…";
  try{
    const {data, error} = await db.functions.invoke("request-withdrawal", {body: {amount: amount, method: method, account_title: acctTitle, account_number: acct, withdraw_pass_hash: await sha256hex("tum-withdraw::"+pw)}});
    if(error) throw error;
    if(data && data.error) throw new Error(data.error);
    // remember for next time (device only)
    me.withdraw_method = method; me.account_title = acctTitle; me.account_number = acct;
    localStorage.setItem("tum_user", JSON.stringify(me));
    await refreshWallet();
    msg.innerHTML = '<div class="notice ok">Withdrawal requested! Rs '+amount.toLocaleString()+' will be sent via '+esc(method)+' ('+esc(acct)+') after admin approval.</div>';
    setTimeout(function(){ VIEWS.wallet(); }, 1400);
  }catch(e){ msg.innerHTML = '<div class="err">'+esc(e.message)+'</div>'; }
}

      thumbHtml +
      (n.is_reported ? '<span class="badge" style="background:var(--red-soft);color:var(--red)">Reported: '+esc(n.report_reason||"no reason")+'</span> ' : '') +
      '<span class="badge '+(n.status==="pending"?"pending":n.status==="rejected"?"rejected":"")+'">'+esc(n.status||"")+'</span></td>' +

      (n.status !== "approved" ? '<button class="btn small" onclick="adminSetStatus('+n.note_id+',\'approved\',\''+tab+'\')">Approve</button> ' : '') +
      (n.status !== "rejected" ? '<button class="btn small danger" onclick="adminSetStatus('+n.note_id+',\'rejected\',\''+tab+'\')">Reject</button> ' : '') +
      '<button class="btn small danger" onclick="adminDeleteNote('+n.note_id+',\''+tab+'\','+(n.status==="pending"?"true":"false")+')">'+(n.status==="pending"?"🗑️ Reject & Delete":"🗑️ Delete")+'</button> ' +

async function adminSetStatus(note_id, status, tab){
  if(!confirm("Set this note to '"+status+"'?")) return;
  const {error} = await db.from("notes").update({status: status}).eq("note_id", note_id);
  if(error){ alert("Failed: " + error.message); return; }
  toast(status === "approved" ? "✅ Note published" : "Note rejected");
  adminDash(currentUser(), tab);
}
async function adminDismissReport(note_id, tab){
  await db.from("notes").update({is_reported: false, report_reason: ""}).eq("note_id", note_id);
  adminDash(currentUser(), tab);
}
async function adminDeleteNote(note_id, tab, wasPending){
  try{
    const {data: sold} = await db.from("orders").select("order_id").eq("note_id", note_id).eq("status","approved").limit(1);
    if(sold && sold.length){
      alert(T("❌ Ye note pehle hi becha ja chuka hai — delete nahi ho sakta (buyers ka record kharab ho jayega). Sirf Reject karo taake listing se hat jaye."));
      return;
    }
  }catch(e){}
  if(!confirm((wasPending ? "Reject karke " : "") + T("Is note ko PERMANENTLY delete karna hai? Ye wapas nahi aayega."))) return;
  try{
    const {data: n} = await db.from("notes").select("file_url,image_urls").eq("note_id", note_id).single();
    const toPath = function(u){
      try{ var m = String(u||"").split("/storage/v1/object/public/notes/"); return m.length > 1 ? decodeURIComponent(m[1].split("?")[0]) : null; }
      catch(e){ return null; }
    };
    const paths = [];
    if(n){
      const p1 = toPath(n.file_url); if(p1) paths.push(p1);
      try{
        const arr = JSON.parse(n.image_urls || "[]");
        (Array.isArray(arr) ? arr : [n.image_urls]).forEach(function(u){ const q = toPath(u); if(q) paths.push(q); });
      }catch(e){ const q2 = toPath(n.image_urls); if(q2) paths.push(q2); }
    }
    if(paths.length) await db.storage.from("notes").remove(paths);
  }catch(e){}
  try{ await db.from("orders").delete().eq("note_id", note_id).neq("status","approved"); }catch(e){}
  const {error} = await db.from("notes").delete().eq("note_id", note_id);
  if(error){ alert("Failed: " + error.message); return; }
  toast("🗑️ Note deleted");
  adminDash(currentUser(), tab);
}

function initRealtime(){
  const dot = document.getElementById("liveDot");
  db.channel("tum-hub-live")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"notes"}, function(p){
      toast("📝 New note submitted: " + (p.new.title || "Untitled"));
      if(currentView === "home" || currentView === "browse") go(currentView, currentArg);
      if(currentView === "admin") adminDash(currentUser(), "pending");
    })
    .on("postgres_changes", {event:"UPDATE", schema:"public", table:"notes"}, function(p){
      if(p.new.status === "approved" && p.old.status !== "approved") toast("✅ Note approved & live: " + (p.new.title || ""));
      const u = currentUser();
      if(u && p.new.seller_id === u.uid && p.new.status === "approved" && p.old.status !== "approved") pushNotif(T("🎉 Note live ho gaya!"), '"' + (p.new.title || T("Aapka note")) + T("\" ab marketplace par bikne ke liye tayyar hye."), "detail:" + p.new.note_id);
      if(u && p.new.seller_id === u.uid && p.new.status === "rejected" && p.old.status !== "rejected") pushNotif(T("⚠️ Note reject ho gaya"), '"' + (p.new.title || "") + T("\" admin ne reject kar diya."), "dashboard");
      if(currentView === "home" || currentView === "browse") go(currentView, currentArg);
      if(currentView === "admin") adminDash(currentUser(), "pending");
    })
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"reviews"}, function(){
      toast("⭐ New review posted");
      if(currentView === "detail") VIEWS.detail(currentArg);
    })
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"orders"}, function(p){
      toast("💰 New payment received — Rs " + Number(p.new.amount||0).toLocaleString());
      if(currentView === "admin") adminDash(currentUser(), "orders");
    })
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"withdrawals"}, function(p){
      toast("🏧 New withdrawal request — Rs " + Number(p.new.amount||0).toLocaleString());
      if(currentView === "admin") adminDash(currentUser(), "withdrawals");
    })
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"subscriptions"}, function(p){
      toast("💎 New plan subscription — " + planName(p.new.plan));
      if(currentView === "admin") adminDash(currentUser(), "subs");
    })
    .on("postgres_changes", {event:"UPDATE", schema:"public", table:"orders"}, function(p){
      const u = currentUser(); if(!u) return;
      if(p.new.status === "approved" && p.old.status !== "approved"){
        if(p.new.buyer_id === u.uid){ pushNotif("✅ Order approved!", "Rs " + Number(p.new.amount||0).toLocaleString() + T(" ka note unlock ho gaya. Kholo aur parho!"), "detail:" + p.new.note_id);
          if(currentView === "detail" && currentNote && Number(currentNote.note_id) === Number(p.new.note_id)) autoUnlock(currentNote); }
        if(p.new.seller_id === u.uid) pushNotif(T("💰 Sale ho gayi!"), "Rs " + Number(p.new.seller_earning||0).toLocaleString() + T(" aapke wallet main add ho gaye."), "wallet");
      }
      if(p.new.status === "rejected" && p.old.status !== "rejected" && p.new.buyer_id === u.uid){
        pushNotif(T("❌ Order reject ho gaya"), T("Aapki payment verify nahi ho saki. Support se rabta karein."), "");
      }
    })
    .on("postgres_changes", {event:"UPDATE", schema:"public", table:"withdrawals"}, function(p){
      const u = currentUser(); if(!u) return;
      if(p.new.seller_id !== u.uid) return;
      if(p.new.status === "approved" && p.old.status !== "approved") pushNotif(T("🏧 Withdrawal bhej di gayi"), "Rs " + Number(p.new.amount||0).toLocaleString() + T(" aapke account par bhej diye gaye."), "wallet");
      if(p.new.status === "rejected" && p.old.status !== "rejected") pushNotif(T("↩️ Withdrawal wapas"), "Rs " + Number(p.new.amount||0).toLocaleString() + T(" aapke wallet main wapas aa gaye."), "wallet");
    })
    .on("postgres_changes", {event:"UPDATE", schema:"public", table:"subscriptions"}, function(p){
      const u = currentUser(); if(!u) return;
      if(p.new.seller_id === u.uid && p.new.status === "approved" && p.old.status !== "approved") pushNotif("💎 Plan active!", T("Aapka ") + planName(p.new.plan) + T(" plan activate ho gaya. Mubarak!"), "plans");
      if(p.new.seller_id === u.uid && p.new.status === "rejected" && p.old.status !== "rejected") pushNotif("❌ Plan reject", T("Subscription verify nahi ho saki."), "plans");
    })
    .subscribe(function(status){ dot.style.opacity = status === "SUBSCRIBED" ? 1 : .35; dot.title = "Realtime: " + status; });
}

/* ================= WISHLIST ================= */
let _wishlist = new Set();
async function loadWishlist(){
  const u = currentUser();
  if(!u){ _wishlist = new Set(); return; }
  try{
    const {data} = await db.from("wishlist").select("note_id").eq("user_id", u.uid);
    _wishlist = new Set((data||[]).map(function(r){ return r.note_id; }));
  }catch(e){ _wishlist = new Set(); }
}
async function toggleWishlist(note_id, ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  const u = requireLogin(); if(!u) return;
  try{
    if(_wishlist.has(note_id)){
      const {error} = await db.from("wishlist").delete().eq("user_id", u.uid).eq("note_id", note_id);
      if(error) throw error;
      _wishlist.delete(note_id);
    }else{
      const {error} = await db.from("wishlist").insert({user_id: u.uid, note_id: note_id});
      if(error) throw error;
      _wishlist.add(note_id);
      toast(T("♥ Wishlist main add ho gaya"));
    }
    document.querySelectorAll('[data-wish="'+note_id+'"]').forEach(function(el){
      const on = _wishlist.has(note_id);
      el.textContent = on ? "♥" : "♡";
      el.style.color = on ? "#dc2626" : "#9aa0b8";
    });
  }catch(e){ toast("Failed: " + e.message); }
}

async function loadNotifCount(){

    const {count} = await db.from("notifications").select("id", {count:"exact", head:true}).eq("user_id", u.uid).eq("is_read", false);
    const b = document.getElementById("notifBadge");
    if(b){
      if(count > 0){ b.style.display = ""; b.textContent = count > 9 ? "9+" : count; }

    }
  }catch(e){}
}
async function pushNotif(title, body, link){
  const u = currentUser(); if(!u) return;
  try{
    await db.from("notifications").insert({user_id: u.uid, title: title, body: body||"", link: link||""});
    loadNotifCount();
  }catch(e){}

function notifGo(link){

  if(link.indexOf("detail:") === 0){ go("detail", Number(link.slice(7))); }
  else if(link === "wallet"){ go("wallet"); }
  else if(link === "dashboard"){ go("dashboard"); }
}

/* ================= PDF PREVIEW (first 2 pages) ================= */
async function renderPdfPreview(pdfUrl, mountId, maxPages){
  const mount = document.getElementById(mountId);
  if(!mount || !window.pdfjsLib) return;
  try{
    mount.innerHTML = '<div class="loading">Loading preview…</div>';
    const pdfjs = window.pdfjsLib;
    pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf = await pdfjs.getDocument(pdfUrl).promise;
    const pages = Math.min(maxPages || 2, pdf.numPages);
    mount.innerHTML = '<div class="sub" style="margin-bottom:10px">'+T("📖 Free preview — pehle ")+pages+T(" pages (poora note unlock karne ke baad)")+'</div><div style="display:flex;gap:12px;flex-wrap:wrap"></div>';
    const wrap = mount.lastChild;
    for(let i=1; i<=pages; i++){
      const page = await pdf.getPage(i);
      const vp = page.getViewport({scale: 1.2});
      const holder = document.createElement("div");
      holder.className = "wm-wrap";
      holder.style.cssText = "position:relative;max-width:100%";
      const cv = document.createElement("canvas");
      cv.width = vp.width; cv.height = vp.height;
      cv.style.cssText = "max-width:100%;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:block";
      holder.appendChild(cv);
      wrap.appendChild(holder);
      await page.render({canvasContext: cv.getContext("2d"), viewport: vp}).promise;
    }
    applyWatermarks();
  }catch(e){
    mount.innerHTML = '<div class="notice warn">"+T("Preview load nahi ho saka.")+"</div>';
  }
}

/* ================= WATERMARKED PDF DOWNLOAD ================= */
async function downloadStampedPdf(note_id){
  const u = requireLogin(); if(!u) return;
  const msg = document.getElementById("stampMsg");
  if(msg) msg.innerHTML = T("⏳ Aapke naam ka watermark lag raha hye…");
  try{
    const {data: sess} = await db.auth.getSession();
    const token = sess && sess.session ? sess.session.access_token : "";
    const res = await fetch(SUPABASE_URL + "/functions/v1/stamped-pdf", {
      method: "POST",
      headers: {"Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": "Bearer " + token},
      body: JSON.stringify({note_id: note_id})
    });
    if(!res.ok){
      const t = await res.text();
      throw new Error(t || ("Server error " + res.status));
    }
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "tum-note-" + note_id + ".pdf";
    document.body.appendChild(a); a.click(); a.remove();
    if(msg) msg.innerHTML = '<div class="notice ok">"+T("✅ Download ho gaya — har page par aapka naam watermark hye.")+"</div>';
  }catch(e){
    if(msg) msg.innerHTML = '<div class="err">Failed: '+esc(e.message)+'</div>';
  }
}
