<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUM Notes Hub — Buy & Sell Study Notes</title>
<meta name="description" content="The student marketplace for study notes at Times University Multan. Buy and sell quality notes, organized by department and subject.">
<style>
:root{
  --bg:#f4f5fa; --card:#ffffff; --ink:#141726; --muted:#69708a;
  --brand:#4f46e5; --brand-d:#3f37c9; --brand-soft:#eef0ff;
  --green:#16a34a; --green-soft:#e8f7ee; --red:#dc2626; --red-soft:#fdecec;
  --amber:#b45309; --amber-soft:#fef4e2; --line:#e6e8f0;
  --shadow:0 2px 10px rgba(20,23,38,.06); --shadow-lg:0 14px 34px rgba(79,70,229,.14);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
header.site{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60}
.nav{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:13px 20px}
.logo{font-weight:900;font-size:21px;color:var(--brand);cursor:pointer;letter-spacing:-.4px;white-space:nowrap}
.logo small{display:block;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:2.5px}
.nav-links{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav-links button{background:none;border:none;padding:9px 15px;border-radius:10px;font-size:14.5px;cursor:pointer;color:var(--ink);font-weight:600;font-family:inherit}
.nav-links button:hover{background:var(--brand-soft)}
.nav-links button.active{background:var(--brand);color:#fff}
.live-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green)}
.live-dot i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
main{max-width:1140px;margin:0 auto;padding:24px 20px 70px}
.hero{background:linear-gradient(120deg,#312e81 0%,#4f46e5 55%,#7c3aed 100%);color:#fff;border-radius:22px;padding:52px 40px;margin-bottom:30px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero h1{font-size:34px;letter-spacing:-.6px;margin-bottom:10px;position:relative;z-index:1}
.hero p{opacity:.92;margin-bottom:22px;font-size:16px;position:relative;z-index:1}
.searchbar{display:flex;gap:8px;max-width:560px;position:relative;z-index:1}
.searchbar input{flex:1;padding:14px 18px;border:none;border-radius:12px;font-size:15px;outline:none;box-shadow:var(--shadow-lg)}
.searchbar button{background:#141726;color:#fff;border:none;border-radius:12px;padding:0 26px;font-size:15px;font-weight:700;cursor:pointer}
.stats{display:flex;gap:26px;margin-top:24px;position:relative;z-index:1}
.stats div b{font-size:22px;display:block}
.stats div span{font-size:12.5px;opacity:.85}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin:8px 0 20px}
.chip{background:var(--card);border:1px solid var(--line);padding:9px 17px;border-radius:999px;font-size:14px;cursor:pointer;font-weight:600;box-shadow:var(--shadow);transition:.15s}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 16px}
.section-title{font-size:22px;font-weight:800;letter-spacing:-.4px}
.section-link{font-size:14px;color:var(--brand);font-weight:700;cursor:pointer;background:none;border:none;font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;transition:transform .14s,box-shadow .14s;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16.5px;margin-bottom:7px;line-height:1.4;letter-spacing:-.2px}
.card .meta{font-size:13px;color:var(--muted);margin-bottom:12px}
.card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--line)}
.price{font-weight:800;font-size:17px;color:var(--brand)}
.price.free{color:var(--green)}
.stars{color:#f59e0b;font-size:14px;letter-spacing:2px}
.rcount{font-size:12px;color:var(--muted)}
.sellerline{font-size:12.5px;color:var(--muted);margin-top:8px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 11px;border-radius:999px;background:var(--brand-soft);color:var(--brand);margin-left:7px;vertical-align:middle}
.badge.pending{background:var(--amber-soft);color:var(--amber)}
.badge.rejected{background:var(--red-soft);color:var(--red)}
.filters{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:20px;box-shadow:var(--shadow);position:sticky;top:67px;z-index:40}
.filters .frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.filters .frow:last-child{margin-bottom:0}
.filters select,.filters input[type=text]{padding:10px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;font-family:inherit}
.filters label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.detail{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:var(--shadow)}
.detail h1{font-size:27px;margin-bottom:9px;letter-spacing:-.5px}
.detail .meta{color:var(--muted);font-size:14px;margin-bottom:18px}
.detail .topline{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.detail .desc{background:var(--bg);border-radius:13px;padding:18px;font-size:15px;line-height:1.65;margin:18px 0;white-space:pre-wrap}
.btn{background:var(--brand);color:#fff;border:none;border-radius:11px;padding:13px 26px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:var(--red)}
.btn.small{padding:8px 15px;font-size:13px;border-radius:9px}
.back{background:none;border:none;color:var(--brand);font-weight:700;font-size:14px;cursor:pointer;margin-bottom:16px;font-family:inherit}
.review{border-top:1px solid var(--line);padding:15px 0}
.review .who{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.review .txt{font-size:14.5px;margin-top:7px;line-height:1.55;color:#333a4d}
form.fcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;max-width:660px;box-shadow:var(--shadow)}
form.fcard h2{margin-bottom:8px;letter-spacing:-.4px}
form.fcard .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:7px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.field textarea{min-height:96px;resize:vertical}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.notice{background:var(--brand-soft);border:1px solid #c9d2fd;color:#3730a3;border-radius:11px;padding:13px 16px;font-size:14px;margin-bottom:16px;line-height:1.5}
.notice.warn{background:var(--amber-soft);border-color:#f3d38b;color:#92400e}
.notice.ok{background:var(--green-soft);border-color:#a9dfc0;color:#166534}
.tabs{display:flex;gap:7px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{background:var(--card);border:1px solid var(--line);padding:11px 20px;border-radius:11px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;box-shadow:var(--shadow)}
.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
table.admin{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-size:14px;box-shadow:var(--shadow)}
table.admin th,table.admin td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.admin th{background:#f3f4f8;font-size:11.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}
table.admin td .acts{white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:15px}
.loading{text-align:center;color:var(--muted);padding:56px;font-size:15px}
.err{background:var(--red-soft);color:#991b1b;border-radius:11px;padding:13px 16px;margin-bottom:15px;font-size:14px}
#toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:#141726;color:#fff;padding:14px 19px;border-radius:13px;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:slidein .25s ease;max-width:330px}
@keyframes slidein{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.skel{background:linear-gradient(90deg,#eceef4 25%,#f7f8fc 50%,#eceef4 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:var(--radius);height:190px}
@keyframes sk{to{background-position:-200% 0}}
footer.site{border-top:1px solid var(--line);background:var(--card);margin-top:20px}
footer.site .in{max-width:1140px;margin:0 auto;padding:30px 20px;display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;align-items:center;color:var(--muted);font-size:13.5px}
@media(max-width:640px){.frow2{grid-template-columns:1fr}.hero{padding:36px 24px}.hero h1{font-size:25px}.nav{flex-wrap:wrap}.stats{gap:16px}}
</style>
</head>
<body>
<header class="site">
  <div class="nav">
    <div class="logo" onclick="go('home')">TUM Notes Hub<small>TIMES UNIVERSITY MULTAN</small></div>
    <div class="nav-links">
      <span class="live-dot" id="liveDot" title="Realtime connection"><i></i>Live</span>
      <button data-nav="home" onclick="go('home')">Home</button>
      <button data-nav="browse" onclick="go('browse')">Browse</button>
      <button data-nav="sell" onclick="go('sell')">Sell</button>
      <button data-nav="admin" onclick="go('admin')">Admin</button>
    </div>
  </div>
</header>
<main id="app"><div class="loading">Loading…</div></main>
<div id="toasts"></div>
<footer class="site"><div class="in">
  <div><b style="color:var(--ink)">TUM Notes Hub</b> — the student marketplace for study notes.</div>
  <div>Times University Multan · Built for students, by students</div>
</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://xsvkyiigcjibgkcytssr.supabase.co";
const SUPABASE_KEY = "sb_publishable_srRWNgXit_vUS9V2CXk39g_yVolDTNe";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= HELPERS ================= */
const app = document.getElementById("app");
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(ms){ if(!ms) return "—"; const d = new Date(Number(ms)); return isNaN(d) ? "—" : d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }
function starStr(r){ r = Number(r)||0; let s=""; for(let i=1;i<=5;i++) s += i <= Math.round(r) ? "★" : "☆"; return '<span class="stars">'+s+'</span>'; }
function priceStr(p){ p = Number(p)||0; return p === 0 ? '<span class="price free">Free</span>' : '<span class="price">Rs '+p.toLocaleString()+'</span>'; }
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.getElementById("toasts").appendChild(t); setTimeout(()=>t.remove(), 4200); }
function setNav(n){ document.querySelectorAll("[data-nav]").forEach(b => b.classList.toggle("active", b.dataset.nav === n)); }
function go(view, arg){ setNav(view); currentView = view; currentArg = arg; VIEWS[view](arg); window.scrollTo(0,0); }
let currentView = "home", currentArg = null;

/* ================= FILTER STATE ================= */
const filters = Object.assign({q:"", dept:"", free:"all", subject:"", sem:"", band:"any", sort:"new"},
  JSON.parse(localStorage.getItem("tum_filters") || "{}"));
function saveFilters(){ localStorage.setItem("tum_filters", JSON.stringify(filters)); }
let DEPARTMENTS = [];

/* ================= DATA ================= */
async function approvedNotes(limit){
  let q = db.from("notes").select("*").eq("status","approved").order("created_at",{ascending:false});
  if(limit) q = q.limit(limit);
  const {data, error} = await q;
  if(error) throw error;
  return data || [];
}
function noteCard(n){
  return '<div class="card" onclick="go(\'detail\','+n.note_id+')">' +
    (n.image_urls ? '<img src="'+esc(n.image_urls)+'" alt="" loading="lazy" style="width:100%;height:150px;object-fit:cover;border-radius:10px;margin-bottom:12px">' : '') +
    '<h3>'+esc(n.title || "Untitled note")+'</h3>' +
    '<div class="meta">'+esc(n.subject||"")+' · '+esc(n.department||"")+(n.semester ? ' · Sem '+n.semester : '')+'</div>' +
    '<div>'+starStr(n.rating)+' <span class="rcount">'+(Number(n.rating)||0).toFixed(1)+' ('+(n.review_count||0)+')</span></div>' +
    '<div class="foot">'+priceStr(n.price)+'<span class="sellerline">'+esc(n.seller_name||"")+'</span></div></div>';
}

/* ================= VIEWS ================= */
const VIEWS = {};
VIEWS.home = async function(){
  app.innerHTML = '<div class="grid">' + '<div class="skel"></div>'.repeat(4) + '</div>';
  try{
    const notes = await approvedNotes(80);
    DEPARTMENTS = [...new Set(notes.map(n => n.department).filter(Boolean))].sort();
    const free = notes.filter(n => Number(n.price) === 0).length;
    const feat = [...notes].sort((a,b)=>(Number(b.rating)||0)-(Number(a.rating)||0)).slice(0,8);
    const latest = notes.slice(0,8);
    app.innerHTML =
      '<div class="hero"><h1>Find notes. Ace exams.</h1><p>Buy &amp; sell quality study notes from TUM students — live marketplace.</p>' +
      '<div class="searchbar"><input id="hq" placeholder="Search anything here…" value="'+esc(filters.q)+'">' +
      '<button onclick="doSearch()">Search</button></div>' +
      '<div class="stats"><div><b>'+notes.length+'</b><span>approved notes</span></div>' +
      '<div><b>'+free+'</b><span>free notes</span></div>' +
      '<div><b>'+DEPARTMENTS.length+'</b><span>departments</span></div></div></div>' +
      '<div class="section-head"><div class="section-title">Browse by department</div></div><div class="chips">' +
      '<div class="chip" onclick="deptGo(\'\')">All</div>' +
      DEPARTMENTS.map(d=>'<div class="chip" onclick="deptGo(\''+esc(d)+'\')">'+esc(d)+'</div>').join("") + '</div>' +
      '<div class="section-head"><div class="section-title">Top rated</div><button class="section-link" onclick="go(\'browse\')">View all →</button></div>' +
      '<div class="grid">' + feat.map(noteCard).join("") + '</div>' +
      '<div class="section-head"><div class="section-title">Fresh uploads</div></div>' +
      '<div class="grid">' + latest.map(noteCard).join("") + '</div>' +
      (notes.length === 0 ? '<div class="empty">No approved notes yet — be the first to <a href="#" onclick="go(\'sell\');return false;" style="color:var(--brand);font-weight:700">sell a note</a>!</div>' : '');
    document.getElementById("hq").addEventListener("keydown", e => { if(e.key === "Enter") doSearch(); });
  }catch(e){ app.innerHTML = '<div class="err">Could not load notes: '+esc(e.message)+'</div>'; }
};
function doSearch(){ filters.q = document.getElementById("hq").value.trim(); saveFilters(); go("browse"); }
function deptGo(d){ filters.dept = d; filters.q = ""; saveFilters(); go("browse"); }

VIEWS.browse = async function(){
  app.innerHTML = '<div class="grid">' + '<div class="skel"></div>'.repeat(4) + '</div>';
  try{
    const notes = await approvedNotes(300);
    DEPARTMENTS = [...new Set(notes.map(n => n.department).filter(Boolean))].sort();
    renderBrowse(notes);
  }catch(e){ app.innerHTML = '<div class="err">Could not load notes: '+esc(e.message)+'</div>'; }
};
function renderBrowse(notes){
  const f = filters;
  let list = notes.filter(n => {
    if(f.q){ const q = f.q.toLowerCase(); if(!((n.title||"").toLowerCase().includes(q) || (n.subject||"").toLowerCase().includes(q) || (n.seller_name||"").toLowerCase().includes(q))) return false; }
    if(f.dept && n.department !== f.dept) return false;
    if(f.free === "free" && Number(n.price) !== 0) return false;
    if(f.free === "paid" && Number(n.price) === 0) return false;
    if(f.subject && !(n.subject||"").toLowerCase().includes(f.subject.toLowerCase())) return false;
    if(f.sem && String(n.semester) !== String(f.sem)) return false;
    if(f.band !== "any"){ const lim = {b50:50,b100:100,b200:200,b300:300}[f.band]; if((Number(n.price)||0) > lim) return false; }
    return true;
  });
  const sorts = { new:(a,b)=>(+b.created_at||0)-(+a.created_at||0), plow:(a,b)=>(+a.price||0)-(+b.price||0),
    phigh:(a,b)=>(+b.price||0)-(+a.price||0), top:(a,b)=>(+b.rating||0)-(+a.rating||0) };
  list.sort(sorts[f.sort] || sorts.new);
  app.innerHTML =
    '<div class="section-title" style="margin-top:4px">Browse notes</div>' +
    '<div class="filters">' +
      '<div class="frow"><label>Search</label><input type="text" id="fq" placeholder="Title, subject, seller…" value="'+esc(f.q)+'" style="flex:1;min-width:180px">' +
      '<label>Type</label><select id="ffree"><option value="all">All</option><option value="free">Free</option><option value="paid">Paid</option></select>' +
      '<label>Department</label><select id="fdept"><option value="">All</option>' + DEPARTMENTS.map(d=>'<option>'+esc(d)+'</option>').join("") + '</select></div>' +
      '<div class="frow"><label>Subject</label><input type="text" id="fsub" placeholder="e.g. Calculus" value="'+esc(f.subject)+'">' +
      '<label>Semester</label><select id="fsem"><option value="">All</option>'+[1,2,3,4,5,6,7,8].map(s=>'<option>'+s+'</option>').join("")+'</select>' +
      '<label>Max price</label><select id="fband"><option value="any">Any</option><option value="b50">≤ Rs 50</option><option value="b100">≤ Rs 100</option><option value="b200">≤ Rs 200</option><option value="b300">≤ Rs 300</option></select>' +
      '<label>Sort</label><select id="fsort"><option value="new">Newest first</option><option value="plow">Price: low → high</option><option value="phigh">Price: high → low</option><option value="top">Top rated</option></select>' +
      '<button class="btn small ghost" onclick="applyFilters()">Apply</button></div>' +
    '</div>' +
    '<div style="color:var(--muted);font-size:14px;margin-bottom:14px">'+list.length+' note(s) found · updates live</div>' +
    '<div class="grid">' + list.map(noteCard).join("") + '</div>' +
    (list.length === 0 ? '<div class="empty">No notes match your filters.</div>' : '');
  ["ffree","fdept","fsem","fband","fsort"].forEach(id => document.getElementById(id).value = f[id==="ffree"?"free":id==="fdept"?"dept":id==="fsem"?"sem":id==="fband"?"band":"sort"]);
  document.getElementById("fq").addEventListener("keydown", e => { if(e.key === "Enter") applyFilters(); });
}
function applyFilters(){
  filters.q = document.getElementById("fq").value.trim();
  filters.free = document.getElementById("ffree").value;
  filters.dept = document.getElementById("fdept").value;
  filters.subject = document.getElementById("fsub").value.trim();
  filters.sem = document.getElementById("fsem").value;
  filters.band = document.getElementById("fband").value;
  filters.sort = document.getElementById("fsort").value;
  saveFilters(); VIEWS.browse();
}

VIEWS.detail = async function(note_id){
  app.innerHTML = '<div class="loading">Loading note…</div>';
  try{
    const {data, error} = await db.from("notes").select("*").eq("note_id", note_id).limit(1);
    if(error) throw error;
    if(!data.length || data[0].status !== "approved"){ app.innerHTML = '<div class="empty">Note not found.</div>'; return; }
    const n = data[0];
    const {data: revs} = await db.from("reviews").select("*").eq("note_id", note_id).order("timestamp",{ascending:false}).limit(50);
    app.innerHTML =
      '<button class="back" onclick="go(\'browse\')">← Back to browse</button>' +
      '<div class="detail">' +
      (n.image_urls ? '<img src="'+esc(n.image_urls)+'" alt="" style="width:100%;max-height:320px;object-fit:cover;border-radius:14px;margin-bottom:18px">' : '') +
      '<h1>'+esc(n.title||"Untitled note")+'</h1>' +
      '<div class="meta">'+esc(n.subject||"")+' · '+esc(n.department||"")+(n.semester?' · Semester '+n.semester:'')+' · by '+esc(n.seller_name||"Unknown seller")+' · '+fmtDate(n.created_at)+'</div>' +
      '<div class="topline">'+priceStr(n.price)+starStr(n.rating)+
      '<span style="font-size:13.5px;color:var(--muted)">'+(Number(n.rating)||0).toFixed(1)+' · '+(n.review_count||0)+' reviews · '+(n.downloads||0)+' downloads</span></div>' +
      (n.ai_summary ? '<div class="desc">'+esc(n.ai_summary)+'</div>' : '') +
      (n.file_url ? '<div style="margin:16px 0"><a class="btn ghost" href="'+esc(n.file_url)+'" target="_blank" rel="noopener">Open / download file</a></div>'
                  : '<div class="notice warn" style="margin:16px 0">The seller has not attached a downloadable file yet.</div>') +
      '<div class="section-title" style="font-size:19px">Reviews</div><div id="revlist">' +
        ((revs||[]).length ? revs.map(r=>'<div class="review"><div class="who">'+esc(r.user_name||"Anonymous")+' '+starStr(r.stars)+'</div><div class="txt">'+esc(r.comment||"")+'</div></div>').join("")
          : '<div class="empty" style="padding:22px">No reviews yet — be the first!</div>') + '</div>' +
      '<div class="section-title" style="font-size:17px">Write a review</div>' +
      '<div class="frow2"><div class="field"><label>Your name</label><input id="rv_name" placeholder="e.g. Ahmed"></div>' +
      '<div class="field"><label>Stars</label><select id="rv_stars"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div></div>' +
      '<div class="field"><label>Comment</label><textarea id="rv_txt" placeholder="What did you think of these notes?"></textarea></div>' +
      '<button class="btn" onclick="submitReview('+n.note_id+')">Submit review</button><div id="rv_msg" style="margin-top:12px"></div></div>';
  }catch(e){ app.innerHTML = '<div class="err">Could not load note: '+esc(e.message)+'</div>'; }
};
async function submitReview(note_id){
  const name = document.getElementById("rv_name").value.trim() || "Anonymous";
  const stars = parseInt(document.getElementById("rv_stars").value, 10);
  const comment = document.getElementById("rv_txt").value.trim();
  const msg = document.getElementById("rv_msg");
  if(!comment){ msg.innerHTML = '<div class="notice warn">Please write a comment.</div>'; return; }
  msg.innerHTML = "Submitting…";
  try{
    const {error} = await db.from("reviews").insert({note_id, user_id: "web_"+Date.now(), user_name: name, stars, comment, timestamp: Date.now()});
    if(error) throw error;
    const {data: all} = await db.from("reviews").select("stars").eq("note_id", note_id);
    const avg = all.reduce((s,r)=>s+Number(r.stars||0),0) / all.length;
    await db.from("notes").update({rating: Math.round(avg*10)/10, review_count: all.length}).eq("note_id", note_id);
    msg.innerHTML = '<div class="notice ok">Review submitted — thank you!</div>';
    setTimeout(()=>VIEWS.detail(note_id), 900);
  }catch(e){ msg.innerHTML = '<div class="err">Failed: '+esc(e.message)+'</div>'; }
}

VIEWS.sell = function(){
  app.innerHTML =
    '<form class="fcard" onsubmit="submitNote(event)"><h2>Sell your notes</h2>' +
    '<div class="sub">Reach hundreds of TUM students. Your note goes to the admin for a quick review first.</div>' +
    '<div id="sell_msg"></div>' +
    '<div class="field"><label>Note title *</label><input id="s_title" required placeholder="e.g. Calculus II — Complete Solved Past Papers"></div>' +
    '<div class="frow2"><div class="field"><label>Subject *</label><input id="s_subject" required placeholder="e.g. Calculus"></div>' +
    '<div class="field"><label>Department</label><input id="s_dept" value="Computing/AI"></div></div>' +
    '<div class="frow2"><div class="field"><label>Semester</label><select id="s_sem">'+[1,2,3,4,5,6,7,8].map(s=>'<option>'+s+'</option>').join("")+'</select></div>' +
    '<div class="field"><label>Price (Rs — 0 = Free) *</label><input id="s_price" type="number" min="0" value="0" required></div></div>' +
    '<div class="field"><label>Your name (seller) *</label><input id="s_name" required placeholder="e.g. Ali Raza"></div>' +
    '<div class="field"><label>Description</label><textarea id="s_desc" placeholder="What is covered in these notes?"></textarea></div>' +
    '<div class="field"><label>Attach note file (PDF, DOC, PPT…) *</label><input id="s_file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.txt,image/*" required></div>' +
    '<div class="field"><label>Cover picture (optional)</label><input id="s_cover" type="file" accept="image/*"></div>' +
    '<button class="btn" type="submit" style="width:100%">Submit for approval</button></form>';
};
async function uploadToStorage(file, folder){
  const ext = (file.name.split(".").pop() || "bin").toLowerCase();
  const path = folder + "/" + Date.now() + "_" + Math.random().toString(36).slice(2,8) + "." + ext;
  const {error} = await db.storage.from("notes").upload(path, file);
  if(error) throw error;
  return db.storage.from("notes").getPublicUrl(path).data.publicUrl;
}
async function submitNote(ev){
  ev.preventDefault();
  const msg = document.getElementById("sell_msg");
  const fileInput = document.getElementById("s_file");
  const coverInput = document.getElementById("s_cover");
  if(!fileInput.files.length){ msg.innerHTML = '<div class="notice warn">Please attach your note file.</div>'; return; }
  msg.innerHTML = "Uploading file…";
  try{
    const fileUrl = await uploadToStorage(fileInput.files[0], "files");
    let coverUrl = "";
    if(coverInput.files.length){ msg.innerHTML = "Uploading cover…"; coverUrl = await uploadToStorage(coverInput.files[0], "covers"); }
    const body = {
      note_id: Math.floor(Date.now()/1000),
      seller_id: "web_" + Date.now(),
      seller_name: document.getElementById("s_name").value.trim(),
      title: document.getElementById("s_title").value.trim(),
      subject: document.getElementById("s_subject").value.trim(),
      department: document.getElementById("s_dept").value.trim() || "Computing/AI",
      semester: parseInt(document.getElementById("s_sem").value,10),
      price: parseInt(document.getElementById("s_price").value,10) || 0,
      ai_summary: document.getElementById("s_desc").value.trim(),
      file_url: fileUrl,
      image_urls: coverUrl,
      status: "pending", created_at: Date.now()
    };
    msg.innerHTML = "Saving…";
    const {error} = await db.from("notes").insert(body);
    if(error) throw error;
    msg.innerHTML = '<div class="notice ok">Submitted! Your note is <b>pending admin approval</b> and will appear publicly once approved.</div>';
    ev.target.reset();
  }catch(e){ msg.innerHTML = '<div class="err">Failed: '+esc(e.message)+'</div>'; }
};

/* ================= ADMIN ================= */
function adminSession(){ try{ return JSON.parse(localStorage.getItem("tum_admin") || "null"); }catch(e){ return null; } }
VIEWS.admin = function(){
  const s = adminSession();
  if(!s){
    app.innerHTML =
      '<form class="fcard" onsubmit="adminLogin(event)" style="max-width:440px;margin:34px auto"><h2>Admin login</h2>' +
      '<div class="sub">Only accounts marked as admin can sign in.</div><div id="al_msg"></div>' +
      '<div class="field"><label>Email</label><input id="al_email" type="email" required></div>' +
      '<div class="field"><label>Password</label><input id="al_pass" type="password" required></div>' +
      '<button class="btn" type="submit" style="width:100%">Sign in</button></form>';
    return;
  }
  adminDash(s, "pending");
};
async function adminLogin(ev){
  ev.preventDefault();
  const msg = document.getElementById("al_msg");
  const email = document.getElementById("al_email").value.trim();
  const pass = document.getElementById("al_pass").value;
  msg.innerHTML = "Signing in…";
  try{
    const {data, error} = await db.from("users").select("uid,name,email,is_admin")
      .eq("email", email).eq("password", pass).eq("is_admin", true).limit(1);
    if(error) throw error;
    if(!data.length){ msg.innerHTML = '<div class="err">Invalid credentials or not an admin.</div>'; return; }
    localStorage.setItem("tum_admin", JSON.stringify({uid: data[0].uid, name: data[0].name}));
    adminDash(data[0], "pending");
  }catch(e){ msg.innerHTML = '<div class="err">Login failed: '+esc(e.message)+'</div>'; }
}
function adminLogout(){ localStorage.removeItem("tum_admin"); go("home"); }
async function adminDash(s, tab){
  app.innerHTML = '<div class="loading">Loading admin panel…</div>';
  try{
    let q = db.from("notes").select("*").order("created_at",{ascending:false}).limit(200);
    if(tab === "pending") q = q.eq("status","pending");
    if(tab === "reported") q = q.eq("is_reported", true);
    const {data: notes, error} = await q;
    if(error) throw error;
    const rows = notes.map(n =>
      '<tr><td><b>'+esc(n.title||"Untitled")+'</b><br><span style="color:var(--muted);font-size:12.5px">'+esc(n.subject||"")+' · '+esc(n.seller_name||"")+' · Rs '+(Number(n.price)||0)+' · '+fmtDate(n.created_at)+'</span>' +
      (n.is_reported ? '<br><span class="badge" style="background:var(--red-soft);color:var(--red)">Reported: '+esc(n.report_reason||"no reason")+'</span>' : '') +
      ' <span class="badge '+(n.status==="pending"?"pending":n.status==="rejected"?"rejected":"")+'">'+esc(n.status||"")+'</span></td>' +
      '<td class="acts">' +
      (n.status !== "approved" ? '<button class="btn small" onclick="adminSetStatus('+n.note_id+',\'approved\',\''+tab+'\')">Approve</button> ' : '') +
      (n.status !== "rejected" ? '<button class="btn small danger" onclick="adminSetStatus('+n.note_id+',\'rejected\',\''+tab+'\')">Reject</button> ' : '') +
      (n.is_reported ? '<button class="btn small ghost" onclick="adminDismissReport('+n.note_id+',\''+tab+'\')">Dismiss report</button>' : '') +
      '</td></tr>').join("");
    app.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:10px">' +
      '<div class="section-title" style="margin:0">Admin panel</div>' +
      '<div><span style="font-size:14px;color:var(--muted);margin-right:12px">👤 '+esc(s.name||s.uid)+'</span><button class="btn small ghost" onclick="adminLogout()">Logout</button></div></div>' +
      '<div class="notice">New submissions arrive here as <b>pending</b> — approve them to publish instantly to the live site.</div>' +
      '<div class="tabs"><button class="'+(tab==="pending"?"active":"")+'" onclick="adminDash(adminSession(),\'pending\')">Pending</button>' +
      '<button class="'+(tab==="reported"?"active":"")+'" onclick="adminDash(adminSession(),\'reported\')">Reported</button>' +
      '<button class="'+(tab==="all"?"active":"")+'" onclick="adminDash(adminSession(),\'all\')">All notes</button></div>' +
      (notes.length ? '<div style="overflow-x:auto"><table class="admin"><tr><th>Note</th><th>Actions</th></tr>'+rows+'</table></div>' : '<div class="empty">Nothing here. 🎉</div>');
  }catch(e){ app.innerHTML = '<div class="err">Could not load: '+esc(e.message)+'</div>'; }
}
async function adminSetStatus(note_id, status, tab){
  if(!confirm("Set this note to '"+status+"'?")) return;
  const {error} = await db.from("notes").update({status}).eq("note_id", note_id);
  if(error){ alert("Failed: " + error.message); return; }
  adminDash(adminSession(), tab);
}
async function adminDismissReport(note_id, tab){
  await db.from("notes").update({is_reported: false, report_reason: ""}).eq("note_id", note_id);
  adminDash(adminSession(), tab);
}

/* ================= REALTIME ================= */
function initRealtime(){
  const dot = document.getElementById("liveDot");
  db.channel("tum-hub-live")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"notes"}, p => {
      toast("📝 New note submitted: " + (p.new.title || "Untitled"));
      if(currentView === "home" || currentView === "browse") go(currentView, currentArg);
      if(currentView === "admin") adminDash(adminSession(), "pending");
    })
    .on("postgres_changes", {event:"UPDATE", schema:"public", table:"notes"}, p => {
      if(p.new.status === "approved" && p.old.status !== "approved") toast("✅ Note approved & live: " + (p.new.title || ""));
      if(currentView === "home" || currentView === "browse") go(currentView, currentArg);
      if(currentView === "admin") adminDash(adminSession(), "pending");
    })
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"reviews"}, () => {
      toast("⭐ New review posted");
      if(currentView === "detail") VIEWS.detail(currentArg);
    })
    .subscribe(status => { dot.style.opacity = status === "SUBSCRIBED" ? 1 : .35; dot.title = "Realtime: " + status; });
}

/* ================= BOOT ================= */
go("home");
initRealtime();
</script>
