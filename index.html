*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}

.hero{background:linear-gradient(120deg,#312e81 0%,#4f46e5 55%,#7c3aed 100%);color:#fff;border-radius:22px;padding:52px 40px;margin-bottom:30px;position:relative;overflow:hidden}

.section-title{font-size:22px;font-weight:800;letter-spacing:-.4px}
.section-link{font-size:14px;color:var(--brand);font-weight:700;cursor:pointer;background:none;border:none;font-family:inherit}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;transition:transform .14s,box-shadow .14s;box-shadow:var(--shadow);display:flex;flex-direction:column}

.btn{background:var(--brand);color:#fff;border:none;border-radius:11px;padding:13px 26px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}

form.fcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;max-width:660px;box-shadow:var(--shadow)}

.field{margin-bottom:15px}

.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.field textarea{min-height:96px;resize:vertical}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.notice{background:var(--brand-soft);border:1px solid #c9d2fd;color:#3730a3;border-radius:11px;padding:13px 16px;font-size:14px;margin-bottom:16px;line-height:1.5}
.notice.warn{background:var(--amber-soft);border-color:#f3d38b;color:#92400e}
.notice.ok{background:var(--green-soft);border-color:#a9dfc0;color:#166534}
.tabs{display:flex;gap:7px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{background:var(--card);border:1px solid var(--line);padding:11px 20px;border-radius:11px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;box-shadow:var(--shadow)}
.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
table.admin{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-size:14px;box-shadow:var(--shadow)}
table.admin th,table.admin td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.admin th{background:#f3f4f8;font-size:11.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}
table.admin td .acts{white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:15px}
.loading{text-align:center;color:var(--muted);padding:56px;font-size:15px}
.err{background:var(--red-soft);color:#991b1b;border-radius:11px;padding:13px 16px;margin-bottom:15px;font-size:14px}
#toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:#141726;color:#fff;padding:14px 19px;border-radius:13px;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:slidein .25s ease;max-width:330px}

.skel{background:linear-gradient(90deg,#eceef4 25%,#f7f8fc 50%,#eceef4 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:var(--radius);height:190px}

.statcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.statcard .lbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.statcard .val{font-size:30px;font-weight:800;letter-spacing:-.5px}
footer.site{border-top:1px solid var(--line);background:var(--card);margin-top:20px}
footer.site .in{max-width:1140px;margin:0 auto;padding:30px 20px;display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;align-items:center;color:var(--muted);font-size:13.5px}
@media(max-width:640px){.frow2{grid-template-columns:1fr}.hero{padding:36px 24px}.hero h1{font-size:25px}.nav{flex-wrap:wrap}.stats{gap:16px}}
/* ---- splash intro ---- */
#splash{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:radial-gradient(1100px 550px at 50% 18%,#3730a3 0%,#191736 55%,#0e0d1f 100%);transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
.sp-inner{text-align:center;padding:20px;max-width:660px;width:100%}
.sp-stage{animation:stagein .55s ease both}
@keyframes stagein{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.sp-kicker{color:#a5b4fc;font-size:12px;font-weight:800;letter-spacing:6px;margin-bottom:18px}
.sp-brand{font-size:clamp(30px,6.4vw,62px);font-weight:900;letter-spacing:7px;white-space:nowrap;
  background:linear-gradient(90deg,#c7d2fe,#f0abfc,#fde68a,#c7d2fe);background-size:250% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 3.2s linear infinite}
.sp-brand span{display:inline-block;animation:flutter 2.4s ease-in-out infinite}
@keyframes flow{to{background-position:250% center}}
@keyframes flutter{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-11px) rotate(2.5deg)}}
.sp-brand2{font-size:clamp(34px,7vw,68px);font-weight:900;letter-spacing:4px;white-space:nowrap;
  background:linear-gradient(90deg,#fde68a,#f0abfc,#c7d2fe,#fde68a);background-size:250% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 3.2s linear infinite}
.sp-by{color:#e0e7ff;margin-top:16px;font-size:clamp(15px,2.6vw,21px)}
.sp-by b{color:#fde68a}
.sp-tag{color:#8b93b8;margin-top:10px;font-size:12.5px;letter-spacing:3px}
.sp-feats{display:flex;flex-direction:column;gap:14px;margin:26px auto 0;max-width:430px;text-align:left}
.sp-feat{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px 16px}
.sp-feat .ic{font-size:24px;flex:0 0 auto}
.sp-feat .tx{color:#e0e7ff;font-size:14.5px;line-height:1.5}
.sp-feat .tx b{color:#fde68a}
.sp-dots{display:flex;gap:8px;justify-content:center;margin-top:30px}
.sp-dots i{width:8px;height:8px;border-radius:50%;background:#3b4270;transition:all .3s}
.sp-dots i.on{background:#fde68a;transform:scale(1.35)}
.sp-skip{color:#5b6390;margin-top:22px;font-size:12px}
</style>
</head>
<body>

</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://xsvkyiigcjibgkcytssr.supabase.co";
const SUPABASE_KEY = "sb_publishable_srRWNgXit_vUS9V2CXk39g_yVolDTNe";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PAYMENT_METHOD = "Easypaisa";
const PAYMENT_NUMBER = "03374667402";
const PAYMENT_TITLE = "Ahsan Abid";
const MIN_WITHDRAWAL = 500;
const ADMIN_COMMISSION = 0.30;

/* ================= HELPERS ================= */
const app = document.getElementById("app");
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(ms){ if(!ms) return "—"; const d = new Date(Number(ms)); return isNaN(d) ? "—" : d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }
function starStr(r){ r = Number(r)||0; let s=""; for(let i=1;i<=5;i++) s += i <= Math.round(r) ? "★" : "☆"; return '<span class="stars">'+s+'</span>'; }
function priceStr(p){ p = Number(p)||0; return p === 0 ? '<span class="price free">Free</span>' : '<span class="price">Rs '+p.toLocaleString()+'</span>'; }
function imageList(n){ try{ const a = JSON.parse(n.image_urls || "[]"); if(Array.isArray(a) && a.length) return a; }catch(e){} return n.image_urls ? [n.image_urls] : []; }
function galleryHtml(imgs){
  return '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">' +
    imgs.map(function(u){ return '<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" style="width:100%;height:170px;object-fit:cover;border-radius:10px;border:1px solid var(--line)" loading="lazy"></a>'; }).join("") + '</div>';
}
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.getElementById("toasts").appendChild(t); setTimeout(()=>t.remove(), 4500); }
function setNav(n){ document.querySelectorAll("[data-nav]").forEach(b => b.classList.toggle("active", b.dataset.nav === n)); }
function go(view, arg){ setNav(view); currentView = view; currentArg = arg; updateUserBox(); refreshWallet(); VIEWS[view](arg); window.scrollTo(0,0); }
let currentView = "home", currentArg = null, currentNote = null;

/* ================= AUTH ================= */
function currentUser(){ try{ return JSON.parse(localStorage.getItem("tum_user") || "null"); }catch(e){ return null; } }
function setSession(u){ localStorage.setItem("tum_user", JSON.stringify(u)); subscribeWallet(); updateUserBox(); }
async function logout(){ const ch = window._wchan; if(ch){ db.removeChannel(ch); window._wchan = null; } try{ await db.auth.signOut(); }catch(e){} localStorage.removeItem("tum_user"); updateUserBox(); go("home"); }
function requireLogin(){ const u = currentUser(); if(!u){ toast("Please login or create an account first"); go("login"); return null; } return u; }
function updateUserBox(){
  const u = currentUser();
  const box = document.getElementById("userBox");
  const wb = document.getElementById("walletBtn");
  const ab = document.getElementById("adminBtn");
  if(wb) wb.style.display = u ? "" : "none";
  if(ab) ab.style.display = (u && u.is_admin) ? "" : "none";
  if(!box) return;
  box.innerHTML = u
    ? '<span style="font-size:13.5px;font-weight:700">👤 '+esc(u.name||"User")+'</span><button class="btn small ghost" onclick="logout()">Logout</button>'
    : '<button class="btn small" onclick="go(\'login\')">Login / Sign up</button>';
}
async function refreshWallet(){
  const u = currentUser(); if(!u) return;
  try{
    const {data} = await db.from("users").select("wallet,total_earnings,plan,note_limit,plan_expires").eq("uid", u.uid).limit(1);
    if(data && data.length){
      const r = data[0];
      if(r.plan && r.plan !== "free" && r.plan_expires && Number(r.plan_expires) < Date.now()){
        await db.from("users").update({plan:"free", note_limit:25, plan_expires:0}).eq("uid", u.uid);
        r.plan = "free"; r.note_limit = 25; r.plan_expires = 0;
        toast("Your subscription expired — back to Free plan");
      }
      u.wallet = r.wallet; u.total_earnings = r.total_earnings;
      u.plan = r.plan || "free"; u.note_limit = r.note_limit || 25; u.plan_expires = r.plan_expires || 0;
      localStorage.setItem("tum_user", JSON.stringify(u));
      const wb = document.getElementById("walletBtn");
      if(wb) wb.textContent = "Wallet · Rs " + Number(u.wallet||0).toLocaleString();
    }
  }catch(e){}
}
/* ================= AUTH VIEWS (Google only) ================= */
const VIEWS = {};
VIEWS.login = function(){
  if(currentUser()){ go("home"); return; }
  app.innerHTML = '<form class="fcard" onsubmit="return false" style="max-width:460px;margin:40px auto"><h2>Login / Sign up</h2>' +
    '<div class="sub">One-tap secure login with your Google account. Your notes, purchases and wallet stay saved to your account.</div><div id="a_msg"></div>' +
    '<button class="btn" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px" onclick="googleLogin()">' +
    '<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>' +
    'Continue with Google</button>' +
    '<div class="sub" style="margin-top:14px;font-size:12.5px;margin-bottom:0">New here? The same button creates your account and adds a <b>Rs 30</b> welcome bonus to your wallet.</div></form>';
};
async function googleLogin(){
  const msg = document.getElementById("a_msg");
  if(msg) msg.innerHTML = "Opening Google…";
  try{
    const {error} = await db.auth.signInWithOAuth({provider: "google", options: {redirectTo: location.origin + location.pathname}});
    if(error) throw error;

function showAuthBanner(msg){
  let b = document.getElementById("authBanner");
  if(!b){
    b = document.createElement("div");
    b.id = "authBanner";
    b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:1000;background:#7f1d1d;color:#fff;padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.3)";

    document.body.prepend(b);

function cleanAuthParams(){
  try{
    const u = new URL(location.href);
    u.searchParams.delete("code"); u.searchParams.delete("error"); u.searchParams.delete("error_description"); u.searchParams.delete("error_code");
    history.replaceState(null, "", u.pathname + (u.searchParams.toString() ? "?" + u.searchParams.toString() : "") + u.hash);
  }catch(e){}
}
async function handleGoogleSession(){
  if(_gsync) return;
  _gsync = true;
  try{
    const q = new URLSearchParams(location.search);
    const cbErr = q.get("error");
    if(cbErr){
      const msg = "Google login failed: " + ((q.get("error_description") || cbErr).replace(/\+/g, " "));
      cleanAuthParams();
      toast(msg); showAuthBanner(msg); console.error(msg);
      return;
    }
    const code = q.get("code");
    let codeErr = null;
    if(code){
      // Explicit PKCE code exchange — do not rely only on auto-detect
      try{
        const res = await db.auth.exchangeCodeForSession(code);
        if(res && res.error) codeErr = res.error;
      }catch(e){ codeErr = e; }
      cleanAuthParams();
    }
    const {data: sess, error: sessErr} = await db.auth.getSession();
    if(sessErr) throw sessErr;
    const session = sess && sess.session;
    if(!session || !session.user){
      if(code){
        const msg = "Login failed: Google se wapas to aaye lekin session nahi ban saka" + (codeErr ? " (" + (codeErr.message || codeErr) + ")" : "") + ". Dobara try karein.";
        toast(msg); showAuthBanner(msg); console.error(msg, codeErr);
      }
      return;
    }
    const au = session.user;
    const email = (au.email || "").toLowerCase();
    if(!email) throw new Error("Google account has no email address");
    const meta = au.user_metadata || {};
    const name = meta.full_name || meta.name || email.split("@")[0];
    const {data: rows, error: selErr} = await db.from("users").select("*").eq("email", email).limit(1);
    if(selErr) throw selErr;
    let urow;
    if(rows && rows.length){
      urow = rows[0];
    }else{
      const {data: ins, error} = await db.from("users").insert({uid: au.id, name: name, email: email, role: "user", is_admin: false, wallet: 30, total_earnings: 0, plan: "free", note_limit: 25, plan_expires: 0, created_at: Date.now()}).select();
      if(error) throw error;
      urow = ins[0];
      setTimeout(function(){ toast("🎉 Account created — Rs 30 welcome bonus added!"); }, 900);
    }
    setSession({uid: urow.uid, name: urow.name, email: urow.email, is_admin: urow.is_admin});
    await refreshWallet();
    if(code) toast("✅ Logged in as " + (urow.name || email));
  }catch(e){
    const msg = "Login failed: " + (e.message || e);
    console.error(msg, e);
    toast(msg);
    showAuthBanner(msg);
  }finally{
    _gsync = false;
  }
}

function renderBrowse(notes){

    if(f.free === "free" && Number(n.price) !== 0) return false;

async function submitWithdraw(ev){
  ev.preventDefault();
  const me = currentUser(); if(!me) return;
  const msg = document.getElementById("w_msg");
  const amount = Math.floor(Number(document.getElementById("w_amount").value));
  const ep = document.getElementById("w_ep").value.trim();
  if(!amount || amount < MIN_WITHDRAWAL){ msg.innerHTML = '<div class="notice warn">Minimum withdrawal is Rs '+MIN_WITHDRAWAL+'.</div>'; return; }
  if(!ep){ msg.innerHTML = '<div class="notice warn">Please enter your Easypaisa number.</div>'; return; }
  msg.innerHTML = "Processing…";
  try{
    const {data} = await db.from("users").select("wallet").eq("uid", me.uid).limit(1);
    const bal = Number(data[0].wallet)||0;
    if(amount > bal){ msg.innerHTML = '<div class="err">Insufficient balance. Available: Rs '+bal.toLocaleString()+'</div>'; return; }
    const {error: e1} = await db.from("users").update({wallet: bal - amount, easypaisa_number: ep}).eq("uid", me.uid);
    if(e1) throw e1;
    const {error: e2} = await db.from("withdrawals").insert({seller_id: me.uid, seller_name: me.name, amount: amount, easypaisa_number: ep, status: "pending", timestamp: Date.now()});
    if(e2) throw e2;
    await refreshWallet();
    msg.innerHTML = '<div class="notice ok">Withdrawal requested! Rs '+amount.toLocaleString()+' will be sent to '+esc(ep)+' after admin approval.</div>';
    setTimeout(function(){ VIEWS.wallet(); }, 1400);
  }catch(e){ msg.innerHTML = '<div class="err">'+esc(e.message)+'</div>'; }
}

async function adminDash(s, tab){
  app.innerHTML = '<div class="loading">Loading admin panel…</div>';

  if(tab === "withdrawals") return adminWithdrawalsView(s);
  if(tab === "subs") return adminSubsView(s);
  try{
    let q = db.from("notes").select("*").order("created_at",{ascending:false}).limit(200);
    if(tab === "pending") q = q.eq("status","pending");
    if(tab === "reported") q = q.eq("is_reported", true);
    const {data: notes, error} = await q;
    if(error) throw error;
    const rows = notes.map(function(n){
      const ims = n.note_type === "images" ? imageList(n) : [];
      const thumbHtml = ims.length
        ? '<div style="margin-top:8px">' + ims.slice(0,5).map(function(u){ return '<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" style="width:64px;height:64px;object-fit:cover;border-radius:8px;margin:0 6px 6px 0;border:1px solid var(--line)" loading="lazy"></a>'; }).join("") + '</div><div style="font-size:12px;color:var(--muted)">🖼️ '+ims.length+' photos · auto-priced Rs '+(Number(n.price)||0)+' (Rs 2/pic) — click any photo to verify</div>'
        : (n.image_urls ? '<a href="'+esc(n.image_urls)+'" target="_blank" rel="noopener"><img src="'+esc(n.image_urls)+'" style="width:90px;border-radius:8px;margin-top:8px;border:1px solid var(--line)" loading="lazy"></a><br>' : '');
      return '<tr><td><b>'+esc(n.title||"Untitled")+'</b><br>' +
      '<span style="color:var(--muted);font-size:12.5px">'+esc(n.subject||"")+' · '+esc(n.seller_name||"")+' · Rs '+(Number(n.price)||0)+' · '+fmtDate(n.created_at)+'</span><br>' +
      thumbHtml +
      (n.is_reported ? '<span class="badge" style="background:var(--red-soft);color:var(--red)">Reported: '+esc(n.report_reason||"no reason")+'</span> ' : '') +
      '<span class="badge '+(n.status==="pending"?"pending":n.status==="rejected"?"rejected":"")+'">'+esc(n.status||"")+'</span></td>' +
      '<td class="acts">' +
      (n.note_type === "images"
        ? '<span style="font-size:12px;color:var(--muted)">photos above ☝</span> '
        : (n.file_url ? '<a class="btn small ghost" style="text-decoration:none" href="'+esc(n.file_url)+'" target="_blank" rel="noopener">📄 View file</a> ' : '<span style="font-size:12px;color:var(--red)">no file</span> ')) +
      (n.status !== "approved" ? '<button class="btn small" onclick="adminSetStatus('+n.note_id+',\'approved\',\''+tab+'\')">Approve</button> ' : '') +
      (n.status !== "rejected" ? '<button class="btn small danger" onclick="adminSetStatus('+n.note_id+',\'rejected\',\''+tab+'\')">Reject</button> ' : '') +
      (n.is_reported ? '<button class="btn small ghost" onclick="adminDismissReport('+n.note_id+',\''+tab+'\')">Dismiss report</button>' : '') +
      '</td></tr>';
    }).join("");
    app.innerHTML = adminHead(s, tab === "pending" ? "Open each file with <b>📄 View file</b> to verify it, then approve to publish." : null) +
      adminTabs(tab) +
      (notes.length ? '<div style="overflow-x:auto"><table class="admin"><tr><th>Note</th><th>Actions</th></tr>'+rows+'</table></div>' : '<div class="empty">Nothing here. 🎉</div>');
  }catch(e){ app.innerHTML = '<div class="err">Could not load: '+esc(e.message)+'</div>'; }
}
async function adminSetStatus(note_id, status, tab){
  if(!confirm("Set this note to '"+status+"'?")) return;

  if(error){ alert("Failed: " + error.message); return; }

  adminDash(currentUser(), tab);
}

  await db.from("notes").update({is_reported: false, report_reason: ""}).eq("note_id", note_id);

        '<button class="btn small danger" onclick="adminOrderSet('+o.order_id+','+o.note_id+',\'rejected\')">Reject</button>' : '<span style="color:var(--muted);font-size:12.5px">done</span>') +
      '</td></tr>';
    }).join("");
    app.innerHTML = adminHead(s, "Verify each payment screenshot — <b>Verify & unlock</b> splits it: <b>70% to seller wallet</b>, <b>30% commission to your wallet</b>.") +
      adminTabs("orders") +
      (rows ? '<div style="overflow-x:auto"><table class="admin"><tr><th>Order</th><th>Actions</th></tr>'+rows+'</table></div>' : '<div class="empty">No orders yet. 🎉</div>');
  }catch(e){ app.innerHTML = '<div class="err">Could not load orders: '+esc(e.message)+'</div>'; }
}
async function adminOrderSet(order_id, note_id, status){
  if(!confirm("Set this order to '"+status+"'?")) return;
  try{
    const {data: orows} = await db.from("orders").select("*").eq("order_id", order_id).limit(1);
    if(!orows || !orows.length) throw new Error("Order not found");
    const o = orows[0];
    const amount = Number(o.amount)||0;
    const commission = Math.round(amount * ADMIN_COMMISSION);
    const earning = amount - commission;
    const {error} = await db.from("orders").update({status: status, commission: commission, seller_earning: earning}).eq("order_id", order_id);
    if(error) throw error;
    if(status === "approved"){
      const {data: srow} = await db.from("users").select("wallet,total_earnings").eq("uid", o.seller_id).limit(1);
      if(srow && srow.length){
        await db.from("users").update({wallet: (Number(srow[0].wallet)||0)+earning, total_earnings: (Number(srow[0].total_earnings)||0)+earning}).eq("uid", o.seller_id);
      }
      const admin = currentUser();
      if(admin){
        const {data: arow} = await db.from("users").select("wallet,total_earnings").eq("uid", admin.uid).limit(1);
        if(arow && arow.length){
          await db.from("users").update({wallet: (Number(arow[0].wallet)||0)+commission, total_earnings: (Number(arow[0].total_earnings)||0)+commission}).eq("uid", admin.uid);
        }
      }
      const {data: nrow} = await db.from("notes").select("downloads").eq("note_id", note_id).limit(1);
      if(nrow && nrow.length) await db.from("notes").update({downloads: (Number(nrow[0].downloads)||0)+1}).eq("note_id", note_id);
      toast("✅ Approved — seller +Rs "+earning.toLocaleString()+", your commission Rs "+commission.toLocaleString());
    }else{
      toast("Order rejected");
    }
    adminDash(currentUser(), "orders");
  }catch(e){ alert("Failed: " + e.message); }
}

async function adminWithdrawSet(request_id, seller_id, amount, status){
  if(!confirm("Mark this withdrawal as '"+status+"'?")) return;
  try{
    const {error} = await db.from("withdrawals").update({status: status}).eq("request_id", request_id);
    if(error) throw error;
    if(status === "rejected"){
      const {data} = await db.from("users").select("wallet").eq("uid", seller_id).limit(1);
      if(data && data.length) await db.from("users").update({wallet: (Number(data[0].wallet)||0)+Number(amount)}).eq("uid", seller_id);
      toast("Rejected — amount refunded to seller wallet");
    }else{
      toast("✅ Marked as sent");
    }
    adminDash(currentUser(), "withdrawals");
  }catch(e){ alert("Failed: " + e.message); }
}

async function adminSubSet(id, seller_id, plan, status){
  if(!confirm("Set this subscription to '"+status+"'?")) return;
  try{
    const {error} = await db.from("subscriptions").update({status: status}).eq("id", id);
    if(error) throw error;
    if(status === "approved"){
      const p = PLANS[plan] || PLANS.free;
      await db.from("users").update({plan: plan, note_limit: p.notes, plan_expires: Date.now()+30*864e5}).eq("uid", seller_id);
      toast("✅ "+p.name+" plan activated for seller");
    }else{ toast("Subscription rejected"); }
    adminDash(currentUser(), "subs");
  }catch(e){ alert("Failed: "+e.message); }
}

/* ================= REALTIME ================= */
let walletChannel = null;
function subscribeWallet(){
  try{
    if(walletChannel){ db.removeChannel(walletChannel); walletChannel = null; }
    const u = currentUser(); if(!u) return;
    walletChannel = db.channel("wallet-" + u.uid)
      .on("postgres_changes", {event:"UPDATE", schema:"public", table:"users", filter:"uid=eq."+u.uid}, function(){ refreshWallet(); })
      .subscribe();
  }catch(e){}
}
function initRealtime(){
  const dot = document.getElementById("liveDot");
  db.channel("tum-hub-live")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"notes"}, function(p){
      toast("📝 New note submitted: " + (p.new.title || "Untitled"));
      if(currentView === "home" || currentView === "browse") go(currentView, currentArg);
      if(currentView === "admin") adminDash(currentUser(), "pending");
    })
    .on("postgres_changes", {event:"UPDATE", schema:"public", table:"notes"}, function(p){
      if(p.new.status === "approved" && p.old.status !== "approved") toast("✅ Note approved & live: " + (p.new.title || ""));
      if(currentView === "home" || currentView === "browse") go(currentView, currentArg);
      if(currentView === "admin") adminDash(currentUser(), "pending");
    })
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"reviews"}, function(){
      toast("⭐ New review posted");
      if(currentView === "detail") VIEWS.detail(currentArg);
    })
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"orders"}, function(p){
      toast("💰 New payment received — Rs " + Number(p.new.amount||0).toLocaleString());
      if(currentView === "admin") adminDash(currentUser(), "orders");
    })
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"withdrawals"}, function(p){
      toast("🏧 New withdrawal request — Rs " + Number(p.new.amount||0).toLocaleString());
      if(currentView === "admin") adminDash(currentUser(), "withdrawals");
    })
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"subscriptions"}, function(p){
      toast("💎 New plan subscription — " + planName(p.new.plan));
      if(currentView === "admin") adminDash(currentUser(), "subs");
    })
    .subscribe(function(status){ dot.style.opacity = status === "SUBSCRIBED" ? 1 : .35; dot.title = "Realtime: " + status; });
}

let spIdx = -1, spTimer = null;
function spFlutter(){ const b = document.querySelector("#spStage .sp-brand"); if(!b || b.dataset.fl) return; b.dataset.fl = "1"; const t = b.textContent; b.innerHTML = [...t].map(function(c,i){ return '<span style="animation-delay:'+(i*0.055).toFixed(2)+'s">'+(c===" "?"&nbsp;":esc(c))+"</span>"; }).join(""); }
function spShow(i){
  spIdx = i;
  const st = document.getElementById("spStage"); if(!st) return;
  st.innerHTML = SP_STAGES[i];
  spFlutter();
  const d = document.getElementById("spDots");
  if(d) d.innerHTML = SP_STAGES.map(function(_,j){ return '<i class="'+(j===i?"on":"")+'"></i>'; }).join("");
}
function runSplash(){
  spShow(0);
  if(spTimer) clearInterval(spTimer);
  spTimer = setInterval(function(){
    if(spIdx >= SP_STAGES.length - 1){ clearInterval(spTimer); spTimer = null; hideSplash(); }
    else spShow(spIdx + 1);
  }, 2600);
}
function skipSplash(){ if(spTimer){ clearInterval(spTimer); spTimer = null; } hideSplash(); }
